<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G6 Jersey Entries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#FF4D00; --peach:#FFE5B4; --smoothie:#FFC8C3;
    --bg:#0c1018; --panel:#141a25; --panel2:#1b2230; --line:#2a3344; --text:#eef1f6; --muted:#9aa4b5;
    --ok:#3ecf8e; --warn:#ffb648; --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text);line-height:1.45;min-height:100vh;
    background:radial-gradient(900px 500px at 10% -10%, rgba(255,77,0,.18), transparent 60%),var(--bg);
  }
  .wrap{max-width:1400px;margin:0 auto;padding:28px 20px 60px}
  header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:20px}
  .logo{width:60px;aspect-ratio:1319/1193;border-radius:12px;object-fit:cover;box-shadow:0 8px 24px rgba(255,77,0,.35)}
  h1{margin:0;font-family:Oswald;font-weight:700;font-size:28px;letter-spacing:1.5px;text-transform:uppercase}
  header p{margin:2px 0 0;color:var(--muted);font-size:14px}
  .sp{flex:1}
  .btn{border:0;border-radius:10px;padding:10px 16px;font:700 14px Inter;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
  .btn.primary{background:var(--orange);color:#fff;box-shadow:0 8px 20px rgba(255,77,0,.3)}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .stat{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px 14px;min-width:110px}
  .stat b{display:block;font-family:Oswald;font-size:24px;font-weight:600}
  .stat span{font-size:12px;color:var(--muted)}
  .tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  input,select{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:9px 11px;border-radius:9px;font:500 14px Inter;outline:none}
  input:focus,select:focus{border-color:var(--orange)}
  #q{min-width:240px;flex:1;max-width:360px}
  .tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:11px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;background:var(--panel2);position:sticky;top:0;cursor:pointer;user-select:none}
  th:hover{color:var(--text)}
  th .ar{opacity:.7;margin-left:4px}
  tbody tr:hover{background:rgba(255,77,0,.06)}
  td.c{text-align:center}
  td.num{font-family:Oswald;font-weight:600;font-size:16px;color:#fff;text-align:center}
  td.jn{font-family:Oswald;font-weight:600;letter-spacing:1px}
  td.notes{white-space:normal;min-width:160px;color:#cfd5df}
  td.price{text-align:right;font-weight:600;color:var(--peach);font-variant-numeric:tabular-nums}
  tfoot td{background:var(--panel2);font-weight:600}
  tfoot tr.sub td{color:var(--muted);font-size:13px;border-bottom:1px solid var(--line)}
  tfoot tr.grand td{font-family:Oswald;font-size:17px;letter-spacing:.5px;color:#fff;border-bottom:0}
  tfoot tr.grand td.price{color:var(--orange);font-size:19px}
  .stat.total{border-color:rgba(255,77,0,.6);background:linear-gradient(90deg, rgba(255,77,0,.16), transparent), var(--panel2)}
  .stat.total b{color:var(--peach)}
  .stat.ok b{color:var(--ok)} .stat.due b{color:#ffb648}
  td.paid{text-align:center;min-width:92px}
  .paybtn{min-width:76px;height:30px;border-radius:8px;border:1.5px dashed #46526a;background:transparent;color:var(--muted);font:700 12.5px Inter;cursor:pointer}
  .paybtn:hover{border-color:var(--ok)}
  .paybtn:hover:empty::after{content:"Mark paid";font-weight:600;color:var(--muted)}
  .paybtn.on{border:1.5px solid rgba(62,207,142,.6);background:rgba(62,207,142,.14);color:var(--ok)}
  .paybtn:disabled{opacity:.5;cursor:wait}
  tr.is-paid td{background:rgba(62,207,142,.04)}
  tfoot tr.okrow td.price{color:var(--ok)} tfoot tr.duerow td.price{color:#ffb648}
  .muted{color:var(--muted)}
  .empty{color:var(--muted);text-align:center;padding:30px}
  .status{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
  .dot{width:8px;height:8px;border-radius:50%;background:#556}
  .dot.live{background:var(--ok);box-shadow:0 0 0 3px rgba(62,207,142,.2)}
  .dot.off{background:var(--warn)}
  .login{max-width:420px;margin:60px auto}
  .login h2{margin:0 0 6px;font-family:Oswald;letter-spacing:1px;text-transform:uppercase}
  .login p{color:var(--muted);font-size:14px;margin:0 0 14px}
  .login input{width:100%;margin-bottom:12px}
  .err{color:#ff9a9a;font-size:13px;min-height:18px;margin-bottom:8px}
  .gone{display:none !important}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:#1f2838;border:1px solid var(--line);padding:11px 16px;border-radius:11px;font-size:14px;font-weight:600;transition:all .2s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

  const STYLE = { basketball: "Basketball", volleyball: "Volleyball (Women's)", volleyball_men: "Volleyball (Men's) / Badminton" };
  const ITEMS = { upper: "Upper jersey only", shorts: "Shorts only", full: "Full jersey" };
  const SLEEVE = { with: "With sleeves", without: "Sleeveless" };
  const POCKET = { with: "With pockets", without: "Without pockets" };
  const SIZES = ["XS","S","M","L","XL","2XL","3XL","4XL"];
  const PRICE = { upper: 40, full: 70 }; // AED per player
  const price = e => PRICE[e.items] || 0;
  const aed = n => n.toLocaleString("en-US") + " AED";
  const sum = list => list.reduce((a, e) => a + price(e), 0);
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  // Column definitions: key, header, value for display/sort/pdf
  const COLS = [
    { k: "idx", h: "#", v: (e, i) => i + 1, cls: "c", nosort: true },
    { k: "fullName", h: "Full name", v: e => e.fullName },
    { k: "sex", h: "Sex", v: e => e.sex },
    { k: "kitStyle", h: "Kit style", v: e => STYLE[e.kitStyle] || e.kitStyle },
    { k: "items", h: "Order", v: e => ITEMS[e.items] || e.items },
    { k: "price", h: "Cost", v: e => price(e) ? aed(price(e)) : "No price", cls: "price", sortv: e => price(e) },
    { k: "paid", h: "Paid", v: e => e.paid ? "Paid" : "", cls: "paid", sortv: e => e.paid ? 1 : 0, html: e =>
      `<button type="button" class="paybtn${e.paid ? " on" : ""}" data-pay="${esc(e.id)}" title="${e.paid ? "Paid " + esc(fmt(e.paid)) + ". Click to mark unpaid" : "Click to mark as paid"}">${e.paid ? "✓ Paid" : ""}</button>` },
    { k: "sleeves", h: "Sleeves", v: e => SLEEVE[e.sleeves] || "-" },
    { k: "jerseyName", h: "Name on jersey", v: e => e.jerseyName || "-", cls: "jn" },
    { k: "jerseyNumber", h: "No.", v: e => e.jerseyNumber === "" ? "-" : e.jerseyNumber, cls: "num",
      sortv: e => e.jerseyNumber === "" ? 999 : +e.jerseyNumber },
    { k: "upperSize", h: "Jersey size", v: e => e.upperSize || "-", cls: "c", sortv: e => e.upperSize ? SIZES.indexOf(e.upperSize) : 99 },
    { k: "shortsSize", h: "Shorts size", v: e => e.shortsSize || "-", cls: "c", sortv: e => e.shortsSize ? SIZES.indexOf(e.shortsSize) : 99 },
    { k: "pockets", h: "Pockets", v: e => POCKET[e.pockets] || "-" },
    { k: "notes", h: "Notes", v: e => e.notes || "", cls: "notes" },
    { k: "updatedAt", h: "Last updated", v: e => fmt(e.updatedAt || e.createdAt), sortv: e => e.updatedAt || e.createdAt || "" }
  ];
  const PRICE_COL = COLS.findIndex(c => c.k === "price");
  function fmt(iso) {
    const d = new Date(iso); if (!iso || isNaN(d)) return "";
    return d.toLocaleString(undefined, { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
  }

  let entries = [], sortKey = "fullName", sortDir = 1, timer = null;

  function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("show"), 2200); }

  async function load() {
    const r = await fetch(API_URL + (API_URL.includes("?") ? "&" : "?") + "t=" + Date.now());
    const j = await r.json();
    if (!j || !j.ok || !Array.isArray(j.entries)) throw new Error("bad");
    entries = j.entries.filter(e => e && e.id);
    render();
  }
  function setStatus(ok) {
    $("#dot").className = "dot " + (ok ? "live" : "off");
    $("#statusTxt").textContent = ok ? "Live" : "Can't reach the order list";
  }

  function view() {
    const q = $("#q").value.trim().toLowerCase();
    const st = $("#fStyle").value, it = $("#fItems").value, sx = $("#fSex").value, pd = $("#fPaid").value;
    let list = entries.filter(e =>
      (!st || e.kitStyle === st) && (!it || e.items === it) && (!sx || e.sex === sx) &&
      (!pd || (pd === "paid" ? !!e.paid : !e.paid)) &&
      (!q || [e.fullName, e.jerseyName, e.jerseyNumber, e.notes, STYLE[e.kitStyle]].join(" ").toLowerCase().includes(q)));
    const col = COLS.find(c => c.k === sortKey);
    const key = col.sortv || col.v;
    list.sort((a, b) => {
      const x = key(a), y = key(b);
      const r = typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y), undefined, { numeric: true });
      return r * sortDir || String(a.fullName).localeCompare(String(b.fullName));
    });
    return list;
  }

  function render() {
    const list = view();
    const cnt = f => list.filter(f).length;
    $("#stats").innerHTML = [
      [list.length, list.length === entries.length ? "Entries" : `Shown (of ${entries.length})`],
      [cnt(e => e.items === "full"), "Full jersey"], [cnt(e => e.items === "upper"), "Upper jersey only"],
      [cnt(e => e.upperSize), "Jerseys"], [cnt(e => e.shortsSize), "Shorts"]
    ].map(([v, l]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("") +
      `<div class="stat total"><b>${aed(sum(list))}</b><span>To be collected${list.length === entries.length ? "" : " (shown)"}</span></div>` +
      `<div class="stat ok"><b>${aed(sum(list.filter(e => e.paid)))}</b><span>Collected · ${list.filter(e => e.paid).length} paid</span></div>` +
      `<div class="stat due"><b>${aed(sum(list.filter(e => !e.paid)))}</b><span>Outstanding · ${list.filter(e => !e.paid).length} unpaid</span></div>`;

    const head = `<thead><tr>${COLS.map(c => `<th data-k="${c.k}">${c.h}${!c.nosort && c.k === sortKey ? `<span class="ar">${sortDir > 0 ? "▲" : "▼"}</span>` : ""}</th>`).join("")}</tr></thead>`;
    const body = list.length
      ? list.map((e, i) => `<tr class="${e.paid ? "is-paid" : ""}">${COLS.map(c => `<td class="${c.cls || ""}">${c.html ? c.html(e) : esc(c.v(e, i))}</td>`).join("")}</tr>`).join("")
      : `<tr><td colspan="${COLS.length}" class="empty">${entries.length ? "No entries match your search." : "No entries yet."}</td></tr>`;
    const amt = it => list.filter(e => e.items === it).length;
    const foot = list.length ? `<tfoot>${["full", "upper", "shorts"].filter(it => amt(it) && PRICE[it]).map(it =>
        `<tr class="sub"><td colspan="${PRICE_COL}">${ITEMS[it]} · ${amt(it)} × ${PRICE[it]} AED</td><td class="price">${aed(amt(it) * PRICE[it])}</td><td colspan="${COLS.length - PRICE_COL - 1}"></td></tr>`).join("")}
      <tr class="grand"><td colspan="${PRICE_COL}">Total amount to be collected · ${list.length} entr${list.length === 1 ? "y" : "ies"}</td><td class="price">${aed(sum(list))}</td><td colspan="${COLS.length - PRICE_COL - 1}"></td></tr>
      <tr class="sub okrow"><td colspan="${PRICE_COL}">Collected · ${list.filter(e => e.paid).length} paid</td><td class="price">${aed(sum(list.filter(e => e.paid)))}</td><td colspan="${COLS.length - PRICE_COL - 1}"></td></tr>
      <tr class="sub duerow"><td colspan="${PRICE_COL}">Outstanding · ${list.filter(e => !e.paid).length} unpaid</td><td class="price">${aed(sum(list.filter(e => !e.paid)))}</td><td colspan="${COLS.length - PRICE_COL - 1}"></td></tr></tfoot>` : "";
    $("#tbl").innerHTML = head + "<tbody>" + body + "</tbody>" + foot;
  }
  $("#tbl").addEventListener("click", e => {
    const th = e.target.closest("th"); if (!th) return;
    const c = COLS.find(x => x.k === th.dataset.k); if (!c || c.nosort) return;
    if (sortKey === c.k) sortDir = -sortDir; else { sortKey = c.k; sortDir = 1; }
    render();
  });
  $("#tbl").addEventListener("click", async e => {
    const b = e.target.closest("[data-pay]"); if (!b) return;
    const ent = entries.find(x => x.id === b.dataset.pay); if (!ent) return;
    b.disabled = true;
    try {
      const r = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "setPaid", id: ent.id, paid: !ent.paid, password: SETTINGS_PASSWORD }) });
      const j = await r.json();
      if (!j || !j.ok) throw new Error(j && j.error);
      if (Array.isArray(j.entries)) entries = j.entries.filter(x => x && x.id);
      render(); toast(ent.paid ? "Marked unpaid" : "Marked as paid");
    } catch (err) {
      b.disabled = false;
      toast(String(err && err.message) === "invalid" ? "Update the Apps Script (Code.gs) to enable Paid." : "Couldn't save. Try again.");
    }
  });
  ["#q", "#fStyle", "#fItems", "#fSex", "#fPaid"].forEach(s => $(s).addEventListener("input", render));

  // ---------- PDF ----------
  function buildPdf() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });
    const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
    const list = view();
    const filters = [
      $("#fStyle").value && STYLE[$("#fStyle").value], $("#fItems").value && ITEMS[$("#fItems").value],
      $("#fSex").value, $("#fPaid").value && ($("#fPaid").value === "paid" ? "Paid" : "Unpaid"), $("#q").value.trim() && `search "${$("#q").value.trim()}"`
    ].filter(Boolean);
    const today = new Date().toLocaleString(undefined, { day: "2-digit", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" });
    const header = () => {
      doc.setFillColor(20, 26, 37); doc.rect(0, 0, W, 22, "F");
      try { doc.addImage(LOGO, "JPEG", 10, 3.7, 16, 14.5); } catch {}
      doc.setTextColor(255); doc.setFont("helvetica", "bold"); doc.setFontSize(15); doc.text("G6 JERSEY ENTRIES", 30, 11);
      doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(200);
      doc.text(`${list.length} entr${list.length === 1 ? "y" : "ies"} · To be collected ${aed(list.reduce((a, e) => a + price(e), 0))}${filters.length ? " · Filter: " + filters.join(", ") : ""}`, 30, 16.5);
      doc.text(today, W - 10, 13, { align: "right" });
    };
    const pdfCols = COLS.filter(c => c.k !== "updatedAt");
    const total = list.reduce((a, e) => a + price(e), 0);
    doc.autoTable({
      head: [pdfCols.map(c => c.h)],
      body: list.map((e, i) => pdfCols.map(c => String(c.v(e, i)))),
      startY: 28, theme: "grid",
      margin: { left: 8, right: 8, top: 28, bottom: 14 },
      styles: { fontSize: 8.5, cellPadding: 1.8, lineColor: [210, 214, 222], lineWidth: .2, textColor: [25, 25, 25], overflow: "linebreak" },
      headStyles: { fillColor: [255, 77, 0], textColor: 255, fontStyle: "bold" },
      alternateRowStyles: { fillColor: [252, 246, 240] },
      columnStyles: {
        0: { cellWidth: 8, halign: "center" }, 1: { cellWidth: 30 }, 5: { halign: "right", fontStyle: "bold", cellWidth: 21 },
        6: { halign: "center", fontStyle: "bold", textColor: [20, 140, 80], cellWidth: 12 },
        8: { fontStyle: "bold" }, 9: { halign: "center", fontStyle: "bold", cellWidth: 10 }, 10: { halign: "center" },
        11: { halign: "center" }, 13: { cellWidth: 34 }
      },
      foot: [[{ content: `TOTAL AMOUNT TO BE COLLECTED · ${list.length} entr${list.length === 1 ? "y" : "ies"}`, colSpan: 5, styles: { halign: "right" } },
              { content: aed(total), styles: { halign: "right" } }, { content: "", colSpan: 8 }]],
      showFoot: "lastPage",
      footStyles: { fillColor: [255, 229, 180], textColor: [20, 20, 20], fontStyle: "bold", fontSize: 10 },
      didDrawPage: header
    });
    // Price summary under the table
    let y = doc.lastAutoTable.finalY + 8;
    if (y > H - 50) { doc.addPage(); header(); y = 30; }
    doc.autoTable({
      startY: y, theme: "grid", tableWidth: 120, margin: { left: W - 128, right: 8, bottom: 14 },
      head: [["Order", "Qty", "Unit price", "Amount"]],
      body: ["full", "upper"].map(it => { const q = list.filter(e => e.items === it).length; return [ITEMS[it], q, aed(PRICE[it]), aed(q * PRICE[it])]; }),
      foot: [["Total to be collected", list.filter(e => PRICE[e.items]).length, "", aed(total)],
             ["Collected (paid)", list.filter(e => e.paid).length, "", aed(sum(list.filter(e => e.paid)))],
             ["Outstanding (unpaid)", list.filter(e => !e.paid).length, "", aed(sum(list.filter(e => !e.paid)))]],
      styles: { fontSize: 9.5, cellPadding: 2.2, lineColor: [210, 214, 222], lineWidth: .2, textColor: [25, 25, 25] },
      headStyles: { fillColor: [255, 77, 0], textColor: 255, fontStyle: "bold" },
      footStyles: { fillColor: [255, 229, 180], textColor: [20, 20, 20], fontStyle: "bold", fontSize: 11 },
      columnStyles: { 1: { halign: "center" }, 2: { halign: "right" }, 3: { halign: "right" } }
    });
    const pages = doc.getNumberOfPages();
    for (let i = 1; i <= pages; i++) {
      doc.setPage(i); doc.setFontSize(8); doc.setTextColor(140);
      doc.text(`G6 Jersey Entries · Page ${i} of ${pages}`, W / 2, H - 6, { align: "center" });
    }
    return doc.output("blob");
  }
  $("#pdfBtn").addEventListener("click", () => {
    if (!window.jspdf) { toast("PDF tools didn't load. Check your connection and reload."); return; }
    if (!entries.length) { toast("No entries yet."); return; }
    try {
      const blob = buildPdf();
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = `G6-jersey-entries-${new Date().toISOString().slice(0, 10)}.pdf`;
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    } catch { toast("Couldn't create the PDF."); }
  });

  // ---------- Password gate (Settings) ----------
  const SETTINGS_PASSWORD = "0000";
  async function unlock() {
    try { sessionStorage.setItem("g6-settings", "1"); } catch {}
    $("#loginCard").classList.add("gone"); $("#mainCard").classList.remove("gone");
    try { await load(); setStatus(true); } catch { setStatus(false); render(); }
    clearInterval(timer);
    timer = setInterval(async () => { if (document.hidden) return; try { await load(); setStatus(true); } catch { setStatus(false); } }, 15000);
  }
  function tryLogin() {
    if ($("#key").value === SETTINGS_PASSWORD) unlock();
    else { $("#loginErr").textContent = "Wrong password."; $("#key").select(); }
  }
  $("#loginBtn").addEventListener("click", tryLogin);
  $("#key").addEventListener("keydown", e => { if (e.key === "Enter") tryLogin(); });
  $("#logoutBtn").addEventListener("click", () => {
    clearInterval(timer); entries = [];
    try { sessionStorage.removeItem("g6-settings"); } catch {}
    $("#mainCard").classList.add("gone"); $("#loginCard").classList.remove("gone"); $("#key").value = "";
  });
  let ok = false; try { ok = sessionStorage.getItem("g6-settings") === "1"; } catch {}
  if (ok) unlock();
})();
</script>
</body>
</html>
