<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11141d">
<title>RAMsys Eye · Aeros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Aeros palette
   Oxygen Blue #3B72ED · Warm Ether #F18D74 · Midnight Carbon #2E3247 · Dusty Stratos #4F5B8A
   ========================================================================== */
:root{
  --blue:#3B72ED; --blue-hi:#5D8BFF; --blue-soft:rgba(59,114,237,.18);
  --ether:#F18D74; --ether-soft:rgba(241,141,116,.18);
  --carbon:#2E3247; --stratos:#4F5B8A;
  --page:#11141D; --panel:#171B28; --card:#1D2233; --card-hi:#232942;
  --line:rgba(255,255,255,.06); --line2:rgba(255,255,255,.11);
  --ink:#F3F5FB; --ink2:#B7BED8; --muted:#7A84A8; --faint:#4A5272;
  --f:'Outfit',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:24px; --spring:cubic-bezier(.34,1.4,.5,1); --out:cubic-bezier(.2,.7,.2,1);
  --hatch:repeating-linear-gradient(135deg,rgba(93,139,255,.42) 0 1.5px,transparent 1.5px 6px);
  --hatch-e:repeating-linear-gradient(135deg,rgba(241,141,116,.5) 0 1.5px,transparent 1.5px 6px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--page);color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue-hi);outline-offset:2px}
svg{display:block}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tab{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- app frame ---------- */
.app{display:grid;grid-template-columns:minmax(320px,31%) 1fr;height:100vh;height:100dvh;padding:14px}
.stage{position:relative;border-radius:30px;overflow:hidden;isolation:isolate;background:#1b2238}
.stage .layer{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transform:scale(1.08);
  transition:opacity .9s var(--out),transform 6s var(--out)}
.stage .layer.on{opacity:1;transform:scale(1)}
.stage .layer video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage .dots{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.35;
  background-image:radial-gradient(rgba(255,255,255,.35) 1px,transparent 1.4px);background-size:22px 22px;
  -webkit-mask-image:linear-gradient(180deg,transparent 35%,#000 100%);mask-image:linear-gradient(180deg,transparent 35%,#000 100%)}
.stage .shade{position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(180deg,rgba(10,12,20,calc(.35 + var(--dim,.25))) 0%,rgba(10,12,20,0) 34%,rgba(10,12,20,0) 58%,rgba(10,12,20,calc(.45 + var(--dim,.25))) 100%),rgba(10,12,20,var(--dim,.25))}
.stage-top{position:absolute;z-index:3;top:22px;left:24px;right:64px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;color:#fff}
.brand img{height:22px;display:block}
.gdr{height:34px;border-radius:9px;background:#fff;padding:2px 8px;margin-left:auto;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.circ{width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:rgba(255,255,255,.08);display:grid;place-items:center;flex:none;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:background .2s,transform .2s,border-color .2s;position:relative;overflow:hidden}
.circ:hover{background:rgba(255,255,255,.16)}
.circ:active{transform:scale(.92)}
.stage-title{position:absolute;z-index:3;left:28px;right:64px;top:118px}
.stage-title h1{margin:0;font-weight:300;font-size:clamp(40px,4.4vw,64px);line-height:1.02;letter-spacing:-.02em;text-shadow:0 4px 30px rgba(0,0,0,.35)}
.stage-title h1 .ch{display:inline-block;white-space:pre;animation:chIn .7s var(--out) both;animation-delay:calc(var(--i) * 28ms)}
@keyframes chIn{from{opacity:0;transform:translateY(.45em) rotate(4deg);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.stage-title p{display:flex;align-items:center;gap:8px;margin:14px 0 0;font-size:14px;color:rgba(255,255,255,.82);animation:fadeUp .6s .25s var(--out) both}
.stage-title p .ico{width:16px;height:16px}
.stage-stats{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;animation:fadeUp .6s .35s var(--out) both}
.sst{padding:10px 14px;border-radius:16px;background:rgba(15,18,30,.38);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.sst b{display:block;font-size:20px;font-weight:400}.sst small{font-size:12px;color:rgba(255,255,255,.7)}
.sst.w b{color:var(--ether)}
.chips{position:absolute;z-index:3;left:18px;right:52px;bottom:18px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px}
.chips::-webkit-scrollbar{display:none}
.chip-row{position:relative;display:flex;gap:8px;flex:none}
.chip{position:relative;z-index:1;flex:none;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(15,18,30,.42);color:#fff;font-size:14px;white-space:nowrap;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:color .35s,background .2s,border-color .3s}
.chip:hover{background:rgba(255,255,255,.14)}
.chip[aria-pressed="true"]{color:#141826;border-color:transparent;background:transparent}
.chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:8px;vertical-align:1px;background:var(--ether)}
.chip-ind{position:absolute;z-index:0;top:0;left:0;height:44px;border-radius:999px;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.25);
  transition:transform .55s var(--spring),width .55s var(--spring)}
.chip.add{width:44px;padding:0;display:grid;place-items:center}

/* ---------- main panel ---------- */
.panel{position:relative;z-index:2;margin-left:-44px;border-radius:32px;background:linear-gradient(180deg,#191E2D,#151926);border:1px solid var(--line);
  box-shadow:-30px 0 60px rgba(0,0,0,.35);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.ptop{display:flex;align-items:center;gap:14px;padding:18px 22px 0 26px}
.ptop .circ{background:rgba(255,255,255,.04);width:42px;height:42px}
.tabs{position:relative;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tb{flex:none;position:relative;z-index:1;border:0;background:none;padding:10px 16px;border-radius:999px;font-size:14px;color:var(--muted);white-space:nowrap;transition:color .3s}
.tb:hover{color:var(--ink2)}
.tb[aria-selected="true"]{color:var(--ink)}
.tab-ind{position:absolute;z-index:0;top:0;left:0;height:100%;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line2);
  transition:transform .55s var(--spring),width .55s var(--spring)}
.tab-ind::after{content:"";position:absolute;left:50%;bottom:-7px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--blue-hi);box-shadow:0 0 10px var(--blue-hi)}
.ptop .sp{flex:1}
.when{font-size:13px;color:var(--muted);white-space:nowrap}
.when b{color:var(--ink2);font-weight:400}
.badge{position:absolute;top:6px;right:6px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--ether);color:#1b1410;font-size:10px;font-weight:600;display:grid;place-items:center}
.me{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.18);flex:none}
.phead{display:flex;align-items:center;gap:14px;padding:20px 22px 6px 26px;flex-wrap:wrap}
.ptitle{position:relative;overflow:hidden;height:52px;flex:1;min-width:200px}
.ptitle h2{position:absolute;inset:0;margin:0;font-weight:300;font-size:40px;line-height:52px;letter-spacing:-.015em;white-space:nowrap;transition:transform .55s var(--out),opacity .4s}
.ptitle h2.out{transform:translateY(-110%);opacity:0}
.ptitle h2.pre{transform:translateY(110%);opacity:0}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line2);background:rgba(255,255,255,.04);font-size:14px;color:var(--ink);white-space:nowrap;position:relative;overflow:hidden;transition:background .2s,border-color .2s}
button.pill:hover{background:rgba(255,255,255,.09)}
.pill .ico{width:17px;height:17px}
.pill.primary{background:var(--blue);border-color:transparent;color:#fff;box-shadow:0 10px 26px rgba(59,114,237,.38)}
.pill.primary:hover{background:var(--blue-hi)}
.view{flex:1;overflow:auto;padding:12px 22px 24px 26px;scrollbar-width:thin;scrollbar-color:var(--carbon) transparent}
.view.leaving>*{animation:leave .22s ease-in forwards}
.view.leaving.r>*{animation-name:leaveR}
@keyframes leave{to{opacity:0;transform:translateX(-26px)}}
@keyframes leaveR{to{opacity:0;transform:translateX(26px)}}
.rise{animation:rise .7s var(--out) both;animation-delay:calc(var(--i,0) * 70ms)}
.rise.fromR{animation-name:riseR}.rise.fromL{animation-name:riseL}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.98)}to{opacity:1;transform:none}}
@keyframes riseR{from{opacity:0;transform:translateX(40px) scale(.98)}to{opacity:1;transform:none}}
@keyframes riseL{from{opacity:0;transform:translateX(-40px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.foot{font-size:12px;color:var(--faint);margin:18px 2px 0}

/* ---------- cards ---------- */
.card{position:relative;border-radius:var(--r);background:linear-gradient(180deg,var(--card-hi),var(--card) 60%);border:1px solid var(--line);padding:20px 22px;min-width:0;overflow:hidden;
  transition:border-color .25s,transform .35s var(--out),box-shadow .35s}
.card.click{cursor:pointer}
.card.click:hover{border-color:rgba(93,139,255,.35);transform:translateY(-3px);box-shadow:0 18px 40px rgba(0,0,0,.28)}
.ch{display:flex;align-items:flex-start;gap:10px}
.ch .t{flex:1;min-width:0}
.ch h3{margin:0;font-weight:400;font-size:18px}
.ch .s{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.ch .s.w{color:var(--ether)}.ch .s.b{color:var(--blue-hi)}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);background:transparent;display:grid;place-items:center;color:var(--ink2);flex:none;position:relative;overflow:hidden;transition:background .2s,color .2s,transform .2s}
.ib:hover{background:rgba(255,255,255,.07);color:var(--ink)}
.ib:active{transform:scale(.9)}
.ib .ico{width:17px;height:17px}
.val{display:flex;align-items:center;gap:12px;margin-top:18px}
.disc{width:38px;height:38px;border-radius:50%;background:var(--blue-soft);color:var(--blue-hi);display:grid;place-items:center;flex:none}
.disc.w{background:var(--ether-soft);color:var(--ether)}
.disc .ico{width:18px;height:18px}
.num{font-size:38px;font-weight:300;letter-spacing:-.02em;line-height:1}
.num sup{font-size:14px;color:var(--ink2);vertical-align:top;margin-left:3px;position:relative;top:4px}
.num small{font-size:16px;color:var(--ink2);margin-left:4px}
.huge{font-size:clamp(84px,9vw,128px);font-weight:200;line-height:.9;letter-spacing:-.05em}
.huge sup{font-size:24px;font-weight:300;vertical-align:top;position:relative;top:14px;margin-left:6px;letter-spacing:0;color:var(--ink2)}
.muted{color:var(--muted)}

/* overview grid */
.ov{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto;gap:14px}
.ov .big{grid-row:span 2;display:flex;flex-direction:column}
.big .row2{display:flex;align-items:flex-end;gap:16px;margin-top:22px}
.big .upd{font-size:13px;color:var(--muted);line-height:1.4}
.big .acts{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.big .chart svg{max-height:240px;margin:0 auto}
.big .ai{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.big .ai b{display:block;font-weight:400;font-size:14px}.big .ai small{font-size:13px;color:var(--muted)}

/* charts */
.chart{margin-top:14px}
.chart svg{width:100%;height:auto;overflow:visible}
.axl{fill:var(--faint);font-size:11px;font-family:var(--f)}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s var(--out) forwards;animation-delay:.15s}
@keyframes draw{to{stroke-dashoffset:0}}
.fadein{opacity:0;animation:fi .9s .5s var(--out) forwards}
@keyframes fi{to{opacity:1}}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:growY .8s var(--out) both}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s var(--spring) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.hb{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px;align-items:end;height:128px;margin-top:22px;padding-top:24px}
.hbc{display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end;position:relative}
.hbb{width:100%;max-width:34px;border-radius:7px 7px 3px 3px;background:var(--hatch);border:1px solid rgba(93,139,255,.25);height:var(--h);transform-origin:bottom;animation:growY .9s var(--out) both;animation-delay:calc(var(--i) * 60ms + .1s)}
.hbc.on .hbb{background:var(--hatch),linear-gradient(180deg,rgba(93,139,255,.45),rgba(59,114,237,.1));border-color:rgba(93,139,255,.7)}
.hbc small{font-size:11px;color:var(--faint)}
.hbc .tag{white-space:nowrap;position:absolute;top:calc(100% - var(--h) - 52px);padding:3px 8px;border-radius:8px;background:var(--blue);color:#fff;font-size:11px;box-shadow:0 6px 16px rgba(59,114,237,.45);animation:pop .5s .7s var(--spring) both}

/* alarm composition */
.comp{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:14px}
.comp-main{padding:20px 22px 18px}
.comp-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.comp-top .mid{flex:1;text-align:center;font-size:13px;color:var(--muted)}
.cols{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:12px;height:330px;margin-top:20px;padding-bottom:4px}
.avg{position:absolute;left:0;right:0;border-top:1px dashed rgba(255,255,255,.14);z-index:0;transition:bottom .6s var(--out)}
.avg span{position:absolute;left:0;top:-18px;font-size:11px;color:var(--faint)}
.col{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0;cursor:pointer}
.col h4{margin:0;font-size:15px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.col .st{font-size:12px;color:var(--muted);margin-top:2px}
.col .st.w{color:var(--ether)}
.col .stem{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;width:100%;margin-top:12px}
.col .vp{padding:4px 10px;border-radius:9px;background:var(--blue);color:#fff;font-size:13px;box-shadow:0 6px 18px rgba(59,114,237,.4);animation:pop .5s var(--spring) both;animation-delay:calc(var(--i) * 70ms + .45s);white-space:nowrap}
.col.w .vp{background:var(--ether);color:#2a1610;box-shadow:0 6px 18px rgba(241,141,116,.4)}
.col .ln{width:1.5px;flex:1;min-height:14px;background:linear-gradient(180deg,var(--blue-hi),rgba(93,139,255,.25));transform-origin:top;animation:growTop .7s var(--out) both;animation-delay:calc(var(--i) * 70ms + .3s)}
.col.w .ln{background:linear-gradient(180deg,var(--ether),rgba(241,141,116,.25))}
@keyframes growTop{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.col .bar{width:100%;max-width:84px;height:var(--h);border-radius:10px 10px 4px 4px;background:var(--hatch);border:1px solid rgba(93,139,255,.25);position:relative;overflow:hidden;
  transform-origin:bottom;animation:growY .9s var(--out) both;animation-delay:calc(var(--i) * 70ms)}
.col.w .bar{background:var(--hatch-e);border-color:rgba(241,141,116,.35)}
.col .crit{position:absolute;left:0;right:0;top:0;height:var(--c);background:linear-gradient(180deg,rgba(241,141,116,.55),rgba(241,141,116,.25));font-size:11px;color:#fff;display:grid;place-items:center}
.col:hover .bar{filter:brightness(1.25)}
.side{display:flex;flex-direction:column;gap:14px}
.side .card{padding:16px 18px}
.sw{position:relative;width:46px;height:26px;border-radius:13px;border:1px solid var(--line2);background:rgba(255,255,255,.06);flex:none;transition:background .3s,border-color .3s;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--stratos);transition:transform .45s var(--spring),background .3s}
.sw[aria-checked="true"]{background:rgba(59,114,237,.25);border-color:rgba(93,139,255,.6)}
.sw[aria-checked="true"]::after{transform:translateX(20px);background:var(--blue-hi);box-shadow:0 0 12px rgba(93,139,255,.7)}
.srow{display:flex;align-items:center;gap:10px;margin-top:14px}
.srow b{font-weight:400}
.mini{display:flex;align-items:center;gap:10px}
.mini .disc{width:34px;height:34px}
.mini b{display:block;font-size:15px;font-weight:400}.mini small{font-size:12px;color:var(--muted)}
.comp-foot{display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.comp-foot .upd{margin-left:auto;font-size:12px;color:var(--muted);text-align:right}

/* segmented sub-menu */
.seg{position:relative;display:inline-flex;padding:4px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--line2);max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{position:relative;z-index:1;border:0;background:none;min-height:36px;padding:0 14px;border-radius:999px;font-size:13px;color:var(--muted);white-space:nowrap;transition:color .3s}
.seg button[aria-pressed="true"]{color:#fff}
.seg button .n{margin-left:6px;font-size:11px;opacity:.75}
.seg-ind{position:absolute;z-index:0;top:4px;left:0;height:calc(100% - 8px);border-radius:999px;background:var(--blue);box-shadow:0 6px 18px rgba(59,114,237,.45);
  transition:transform .5s var(--spring),width .5s var(--spring)}
.swap{transition:opacity .2s,transform .2s}
.swap.out{opacity:0;transform:translateY(8px)}

/* lists */
.list{margin-top:14px;padding:6px}
.lh{display:flex;align-items:center;gap:10px;padding:12px 14px 6px}
.lh h3{margin:0;font-weight:400;font-size:17px;flex:1}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:12px 14px;border-radius:16px;
  transition:background .2s;animation:fadeUp .5s var(--out) both;animation-delay:calc(var(--i) * 35ms)}
.li:hover{background:rgba(255,255,255,.045)}
.li .sv{grid-row:span 2;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:13px;font-weight:600}
.li b{font-weight:400;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .r{grid-row:span 2;text-align:right;font-size:12px;color:var(--muted)}
.li .r em{display:block;font-style:normal;font-size:12px;margin-top:4px}
.tagp{white-space:nowrap;display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;border:1px solid var(--line2);color:var(--ink2)}
.tagp.w{border-color:rgba(241,141,116,.45);color:var(--ether)}
.tagp.b{border-color:rgba(93,139,255,.45);color:var(--blue-hi)}

/* systems grid */
.sysg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:16px}
.syc{display:flex;flex-direction:column;min-height:236px;padding:18px}
.syc .ringw{position:relative;width:112px;height:112px;margin:8px auto 18px}
.syc .ringw svg{width:100%;height:100%;transform:rotate(-90deg)}
.syc .ringw .g{position:absolute;inset:16px;border-radius:50%;display:grid;place-items:center;font-size:30px;color:var(--blue-hi);border:1px solid var(--line2);
  background:radial-gradient(circle at 50% 35%,rgba(93,139,255,.16),transparent 70%)}
.syc.w .ringw .g{color:var(--ether);background:radial-gradient(circle at 50% 35%,rgba(241,141,116,.16),transparent 70%)}
.syc .arc{stroke-dasharray:var(--d) 400;animation:arc 1.2s var(--out) both;animation-delay:calc(var(--i) * 50ms + .1s)}
@keyframes arc{from{stroke-dasharray:0 400}}
.syc .bt{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:auto}
.syc b{display:block;font-weight:400;font-size:15px}
.syc small{font-size:12px;color:var(--muted)}

/* devices */
.devw{display:grid;grid-template-columns:220px minmax(0,1fr) 230px;gap:14px;align-items:stretch}
.mode{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:18px 12px;position:relative}
.mode .disc{margin-bottom:4px}
.mode b{font-size:19px;font-weight:400;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mode small{font-size:12px;color:var(--muted)}
.mode .ib{position:absolute;top:50%;margin-top:-17px;width:34px;height:34px}
.mode .ib.l{left:8px}.mode .ib.r{right:8px}
.mode .lbl{animation:fadeUp .4s var(--out) both}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px 16px}
.center .cap{font-size:13px;color:var(--muted)}
.center .note{margin-top:10px;font-size:14px;color:var(--ink2)}
.scrub{position:relative;margin-top:16px;padding:58px 22px 18px;touch-action:none;user-select:none;-webkit-user-select:none}
.ticks{display:flex;align-items:center;justify-content:space-between;height:72px}
.ticks i{flex:none;width:3px;border-radius:2px;height:var(--h);background:linear-gradient(180deg,rgba(93,139,255,.9),rgba(93,139,255,.2));opacity:.55;transition:opacity .2s,transform .2s;
  transform-origin:center;animation:tick .7s var(--out) both;animation-delay:calc(var(--i) * 6ms)}
@keyframes tick{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.ticks i.w{background:linear-gradient(180deg,var(--ether),rgba(241,141,116,.25))}
.ticks i.near{opacity:1}
.knob{position:absolute;top:72px;width:46px;height:46px;margin-left:-23px;border-radius:50%;border:2px solid var(--ether);background:rgba(23,27,40,.85);display:grid;place-items:center;color:var(--ether);cursor:grab;
  box-shadow:0 0 0 6px rgba(241,141,116,.12),0 0 30px rgba(241,141,116,.35);transition:left .08s linear}
.knob:active{cursor:grabbing}
.knob.anim{transition:left .6s var(--spring)}
.klabel{position:absolute;top:6px;transform:translateX(-50%);padding:6px 12px;border-radius:12px;background:var(--carbon);border:1px solid var(--line2);font-size:12px;white-space:nowrap;pointer-events:none;transition:left .08s linear}
.klabel b{font-weight:500}.klabel span{color:var(--muted)}
.scrub-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}

/* insights */
.gantt{padding:18px 20px 20px}
.gh{display:grid;grid-template-columns:repeat(6,1fr);gap:0;margin-top:14px}
.gh span{padding:10px 12px;border:1px solid var(--line2);border-right:0;font-size:13px;color:var(--ink2)}
.gh span:first-child{border-radius:14px 0 0 14px}.gh span:last-child{border-right:1px solid var(--line2);border-radius:0 14px 14px 0}
.gb{position:relative;margin-top:10px;background-image:radial-gradient(rgba(255,255,255,.12) 1px,transparent 1.3px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:22px 22px,calc(100% / 6) 100%;border-radius:12px;padding:6px 0}
.grow2{position:relative;height:62px}
.gbar{position:absolute;top:8px;bottom:8px;border-radius:14px;background:var(--blue);display:flex;align-items:center;padding:0 14px;font-size:13px;color:#fff;overflow:visible;cursor:pointer;min-width:12px;
  transform-origin:left;animation:barIn .8s var(--out) both;animation-delay:calc(var(--i) * 90ms + .1s);border:0;text-align:left}
.gbar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbar.open{background:linear-gradient(90deg,var(--blue) 0 var(--a),transparent var(--a)),var(--hatch);border:1px dashed rgba(93,139,255,.5)}
.gbar.crit{box-shadow:0 8px 22px rgba(59,114,237,.25)}
@keyframes barIn{from{transform:scaleX(0);opacity:0}to{transform:none;opacity:1}}
.gl{position:absolute;top:50%;transform:translateY(-50%);font-size:13px;color:var(--ink2);white-space:nowrap;text-align:right;pointer-events:none;animation:fadeUp .5s .6s var(--out) both}
.gl small{display:block;font-size:11px;color:var(--muted)}
.bub{position:absolute;right:-6px;top:-30px;padding:4px 10px;border-radius:10px 10px 10px 2px;background:var(--ether);color:#2a1610;font-size:11px;white-space:nowrap;animation:pop .5s 1s var(--spring) both}
.ins2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;margin-top:14px}
.lr{display:grid;grid-template-columns:120px minmax(0,1fr) 44px;align-items:center;gap:12px;padding:9px 0;border:0;background:none;width:100%;text-align:left;border-radius:10px}
.lr:hover{background:rgba(255,255,255,.03)}
.lr span{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .tr{height:14px;border-radius:7px;background:rgba(255,255,255,.05);overflow:hidden}
.lr .tr i{display:block;height:100%;width:var(--w);border-radius:7px;background:var(--hatch),linear-gradient(90deg,rgba(59,114,237,.6),rgba(93,139,255,.9));transform-origin:left;animation:barIn .9s var(--out) both;animation-delay:calc(var(--i) * 70ms)}
.lr.w .tr i{background:var(--hatch-e),linear-gradient(90deg,rgba(241,141,116,.5),rgba(241,141,116,.9))}
.lr.on span{color:var(--blue-hi)}
.lr b{font-weight:400;text-align:right;font-size:14px}

/* drawer */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(6,8,14,.5);opacity:0;pointer-events:none;transition:opacity .3s;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:51;top:14px;right:14px;bottom:14px;width:min(430px,calc(100vw - 28px));border-radius:28px;background:linear-gradient(180deg,#1E2436,#171B28);border:1px solid var(--line2);
  box-shadow:0 30px 80px rgba(0,0,0,.5);transform:translateX(calc(100% + 30px));transition:transform .55s var(--spring);display:flex;flex-direction:column;overflow:hidden}
.drawer.show{transform:none}
.dh{display:flex;align-items:flex-start;gap:12px;padding:22px 22px 10px}
.dh .t{flex:1;min-width:0}
.dh h3{margin:0;font-weight:400;font-size:24px;line-height:1.15}
.dh p{margin:6px 0 0;font-size:13px;color:var(--muted)}
.db{flex:1;overflow:auto;padding:6px 22px 24px}
.db>*{animation:fadeUp .5s var(--out) both;animation-delay:calc(var(--i,0) * 60ms + .15s)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.kv div{padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.kv small{display:block;font-size:12px;color:var(--muted)}
.kv b{font-weight:400;font-size:17px}
.msg{margin-top:14px;padding:14px 16px;border-radius:16px;background:var(--blue-soft);border:1px solid rgba(93,139,255,.25);font-size:14px;line-height:1.5;color:var(--ink)}
.msg.w{background:var(--ether-soft);border-color:rgba(241,141,116,.35)}
.dsec{margin:20px 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chk{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;margin-top:8px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);text-align:left;font-size:14px;transition:background .2s,border-color .2s}
.chk i{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--stratos);flex:none;display:grid;place-items:center;transition:background .3s,border-color .3s}
.chk[aria-pressed="true"]{border-color:rgba(93,139,255,.4);background:rgba(59,114,237,.08)}
.chk[aria-pressed="true"] i{background:var(--blue);border-color:var(--blue)}
.chk[aria-pressed="true"] i::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk[aria-pressed="true"] span{color:var(--ink2);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.3)}
.dev{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:10px 12px;border-radius:12px;border:0;background:none;text-align:left}
.dev:hover{background:rgba(255,255,255,.04)}
.dev i{width:8px;height:8px;border-radius:50%}
.dev b{font-weight:400;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dev span{font-size:12px;color:var(--muted)}
.dev em{font-style:normal;font-size:13px;color:var(--ink2)}

/* search palette */
.pal{position:fixed;z-index:60;left:50%;top:12vh;width:min(620px,calc(100vw - 28px));transform:translate(-50%,-14px) scale(.97);opacity:0;pointer-events:none;
  border-radius:24px;background:#1C2132;border:1px solid var(--line2);box-shadow:0 40px 100px rgba(0,0,0,.55);transition:opacity .25s,transform .45s var(--spring);overflow:hidden}
.pal.show{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
.pal label{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.pal input{flex:1;border:0;outline:0;background:none;font-size:20px;font-weight:300}
.pal input::placeholder{color:var(--faint)}
.pres{max-height:52vh;overflow:auto;padding:8px}
.pr{display:grid;grid-template-columns:90px minmax(0,1fr);gap:2px 12px;width:100%;padding:10px 12px;border:0;background:none;text-align:left;border-radius:14px}
.pr small{grid-row:span 2;align-self:center;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--blue-hi)}
.pr b{font-weight:400;font-size:15px}.pr span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr.on,.pr:hover{background:rgba(59,114,237,.12)}
.pno{padding:16px;color:var(--muted);font-size:14px}

/* appearance */
.ap .db{padding-top:0}
.bgs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bgt{position:relative;aspect-ratio:3/4;border-radius:16px;border:2px solid transparent;background-size:cover;background-position:center;cursor:pointer;overflow:hidden;padding:0;
  box-shadow:inset 0 0 0 1px var(--line2);transition:transform .3s var(--spring),border-color .2s}
.bgt:hover{transform:translateY(-3px)}
.bgt[aria-pressed="true"]{border-color:var(--blue-hi)}
.bgt video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bgt .nm{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 7px;font-size:12px;color:#fff;text-align:left;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.bgt .x,.bgt .star{position:absolute;top:6px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.5);color:#fff;display:grid;place-items:center;font-size:14px;line-height:1}
.bgt .x{right:6px}.bgt .star{left:6px}
.bgt .star .ico{width:14px;height:14px}
.bgt .star.on{background:var(--blue);}
.bgt .star.on .ico{fill:currentColor}
.bgt .vt{position:absolute;right:6px;bottom:6px;z-index:1;padding:2px 6px;border-radius:6px;background:rgba(0,0,0,.6);font-size:10px;font-weight:600;letter-spacing:.04em;color:#fff}
.bgt.up{display:grid;place-items:center;align-content:center;gap:6px;background:rgba(255,255,255,.03);border:2px dashed var(--line2);box-shadow:none;color:var(--ink2);font-size:12px;text-align:center}
.locs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.locs .tagp{cursor:default}
.rng{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;margin-top:10px;font-size:14px;color:var(--ink2)}
.rng output{font-size:13px;color:var(--ink)}
.rng input{grid-column:1/-1;width:100%;accent-color:var(--blue);height:22px}
.hint{font-size:12px;color:var(--muted);line-height:1.5;margin:8px 0 0}
.ap .seg{margin-top:4px}
.drop{outline:2px dashed var(--blue-hi);outline-offset:-10px}

/* ripple + toast */
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.28);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
.toast{position:fixed;z-index:80;left:50%;bottom:26px;transform:translateX(-50%);padding:12px 18px;border-radius:999px;background:var(--carbon);border:1px solid var(--line2);font-size:14px;box-shadow:0 16px 40px rgba(0,0,0,.4);animation:fadeUp .4s var(--spring)}

/* responsive */
@media (max-width:1320px){.ov{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.ov .big{grid-column:1/-1;grid-row:auto}.devw{grid-template-columns:1fr 1fr}.devw .center{grid-column:1/-1;order:-1}}
@media (max-width:1100px){.comp{grid-template-columns:1fr}.side{display:grid;grid-template-columns:repeat(3,1fr)}.ins2{grid-template-columns:1fr}.when{display:none}}
@media (max-width:900px){
  .stage-top,.stage-title{right:20px}.chips{right:18px;bottom:48px}
  .app{display:block;height:auto;padding:10px}
  .stage{height:330px}
  .stage-title{top:84px}
  .stage-stats{display:none}
  .panel{margin:-34px 0 0;border-radius:28px}
  .ptop{padding:14px 14px 0;gap:8px}
  .phead{padding:16px 16px 4px}
  .view{overflow:visible;padding:10px 14px 24px}
  .ptitle h2{font-size:32px}
  .side{grid-template-columns:1fr}
}
@media (max-width:640px){.ptop{flex-wrap:wrap}.ptop .tabs{order:9;width:100%;margin-top:4px}.ov{grid-template-columns:1fr}.devw{grid-template-columns:1fr}.cols{height:280px;gap:6px}.col h4{font-size:12px}.col .st{display:none}.gh span{font-size:11px;padding:8px 4px;text-align:center}
  .lr{grid-template-columns:90px minmax(0,1fr) 36px}.tools .pill span{display:none}.gdr{height:28px}}

/* calm motion */
html.calm *,html.calm *::before,html.calm *::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}
html.calm .stage .layer{transition:opacity .3s!important}
@media print{.stage,.ptop,.tools,.drawer,.scrim{display:none!important}.app{display:block}.panel{margin:0}}
</style>
</head>

const ackR=rng('ack');const ACK7=[...Array(7)].map((_,i)=>Math.round(38+ackR()*18-i*.8));

  nxt.innerHTML='';nxt.style.backgroundImage='';
  if(c&&c.kind==='video'){const v=h('video',{muted:'',loop:'',playsinline:'',autoplay:''});v.muted=true;v.src=URLS[id];v.defaultPlaybackRate=v.playbackRate=G.vspeed;
    v.addEventListener('loadedmetadata',()=>{v.playbackRate=G.vspeed});nxt.append(v);if(!document.hidden&&G.motion!=='calm')v.play().catch(()=>{})}
  else nxt.style.backgroundImage=c?`url("${URLS[id]}")`:SCENES[id].css;
  nxt.classList.remove('on');void nxt.offsetWidth;nxt.classList.add('on');cur.classList.remove('on');
  setTimeout(()=>{if(!cur.classList.contains('on')){const v=cur.querySelector('video');if(v){v.pause();v.removeAttribute('src');v.load()}cur.innerHTML=''}},1000);front=1-front}
function setSpeed(){document.querySelectorAll('#stage video').forEach(v=>{v.defaultPlaybackRate=v.playbackRate=G.vspeed})}
document.addEventListener('visibilitychange',()=>document.querySelectorAll('#stage video').forEach(v=>document.hidden?v.pause():v.play().catch(()=>{})));
function applyMotion(){document.documentElement.classList.toggle('calm',G.motion==='calm'||matchMedia('(prefers-reduced-motion: reduce)').matches)}

async function toJpeg(file){const u=URL.createObjectURL(file);try{const im=new Image();im.src=u;await im.decode();const s=Math.min(1,2560/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');
  c.width=Math.round(im.naturalWidth*s);c.height=Math.round(im.naturalHeight*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,'image/jpeg',.88))}finally{URL.revokeObjectURL(u)}}
async function addFile(f){const vid=/^video\//.test(f.type);
  if(!vid&&!/^image\//.test(f.type)){toast('Choose an image (JPG, PNG, WebP) or a video (MP4, WebM)');return null}
  if(G.customs.length>=MAXC){toast(`All ${MAXC} slots are used; remove one to add another`);return null}
  let blob;if(vid){if(f.size>VMAX){toast('Video is over 300 MB');return null}if(!document.createElement('video').canPlayType(f.type)){toast('This browser cannot play that format; try MP4 (H.264) or WebM');return null}blob=f}
  else{try{blob=await toJpeg(f)}catch(e){toast('Could not read that image');return null}}
  const it={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),kind:vid?'video':'image'};
  try{await iset(it.id,blob)}catch(e){toast('Not enough storage to save this file');return null}
  G.customs.push(it);URLS['c:'+it.id]=URL.createObjectURL(blob);save();return 'c:'+it.id}
async function addFiles(files){let last=null;for(const f of [...files]){const id=await addFile(f);if(id)last=id}
  if(last){G.per[T.loc]=last;save();applyStage();toast(`Added to ${scopeName()} · ${G.customs.length} of ${MAXC} slots used`)}paintAp()}
async function removeCustom(id){const c=cus(id);if(!c)return;G.customs=G.customs.filter(x=>x!==c);if(URLS[id])URL.revokeObjectURL(URLS[id]);delete URLS[id];
  Object.keys(G.per).forEach(k=>{if(G.per[k]===id)delete G.per[k]});if(G.def===id)G.def='';save();applyStage();paintAp();try{await idel(c.id)}catch(e){}}
$('#file').onchange=e=>{addFiles(e.target.files);e.target.value=''};

/* appearance drawer */
let apOpen=false;
function tile(id){const c=cus(id),S=SCENES[id],on=bgFor(T.loc)===id,isDef=G.def===id;
  const t=h('div',{class:'bgt',role:'button',tabindex:'0','aria-pressed':on,'aria-label':`${bgName(id)}: use for ${scopeName()}`,style:S?`background-image:${S.css}`:c&&c.kind==='image'?`background-image:url("${URLS[id]}")`:''});
  if(c&&c.kind==='video'){const v=h('video',{muted:'',playsinline:'',preload:'metadata'});v.muted=true;v.src=URLS[id]+'#t=0.5';t.append(v,h('span',{class:'vt'},'VIDEO'))}
  t.append(h('span',{class:'nm'},bgName(id)));
  const st=h('button',{class:'star'+(isDef?' on':''),type:'button',title:isDef?'Default for every location':'Make default for every location','aria-pressed':isDef,html:ic('star')});
  st.onclick=e=>{e.stopPropagation();G.def=isDef?'':id;if(!isDef)G.per={};save();applyStage();paintAp();toast(isDef?'Default cleared':`${bgName(id)} is now the default for every location`)};t.append(st);
  if(c){const x=h('button',{class:'x',type:'button','aria-label':'Remove '+bgName(id)},'×');x.onclick=e=>{e.stopPropagation();removeCustom(id)};t.append(x)}
  const use=()=>{G.per[T.loc]=id;save();applyStage();paintAp()};t.onclick=use;t.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();use()}};return t}
function paintAp(){if(!apOpen)return;const db=drawer.querySelector('.db');if(!db)return;const y=db.scrollTop;db.innerHTML='';
  const mine=h('div',{class:'bgs'},...G.customs.filter(c=>URLS['c:'+c.id]).map(c=>tile('c:'+c.id)));
  if(G.customs.length<MAXC)mine.append(h('button',{class:'bgt up',type:'button',html:ic('plus')+'Add photo<br>or video',on:{click:()=>$('#file').click()}}));
  const usedBy=id=>[['all','All sites'],...LOCS.map(L=>[L.id,L.short])].filter(([k])=>bgFor(k)===id).map(([,n])=>n);
  const pct=Math.round(G.vspeed*100),vo=h('output',{},G.vspeed.toFixed(2)+'×'),vin=h('input',{type:'range',min:25,max:200,step:5,value:pct,'aria-label':'Video speed'});
  vin.oninput=()=>{G.vspeed=+vin.value/100;vo.textContent=G.vspeed.toFixed(2)+'×';setSpeed()};vin.onchange=save;
  const dout=h('output',{},G.dim+'%'),din=h('input',{type:'range',min:0,max:70,value:G.dim,'aria-label':'Darken background'});
  din.oninput=()=>{G.dim=+din.value;dout.textContent=G.dim+'%';document.documentElement.style.setProperty('--dim',G.dim/100)};din.onchange=save;
  const cur=bgFor(T.loc);
  db.append(
    h('div',{class:'dsec',style:'margin-top:4px'},`Background for ${scopeName()}`),
    h('div',{class:'msg'},h('b',{style:'font-weight:500'},bgName(cur)),` · used by ${usedBy(cur).join(', ')}`),
    h('div',{class:'dsec'},`Your photos and videos · ${G.customs.length} of ${MAXC}`),mine,
    h('p',{class:'hint'},'Tap a tile to use it for the selected location. Tap ★ to make it the default for every location. Drop files onto this panel to add them.'),
    h('div',{class:'dsec'},'Scenes'),h('div',{class:'bgs'},...Object.keys(SCENES).map(tile)),
    h('button',{class:'pill',type:'button',style:'margin-top:12px',on:{click:()=>{G.def=cur;G.per={};save();applyStage();paintAp();toast(bgName(cur)+' now used for every location')}}},'Use '+bgName(cur)+' for every location'),
    h('div',{class:'dsec'},'Video'),h('label',{class:'rng'},h('span',{},'Playback speed'),vo,vin),
    segment([.25,.5,1,1.5,2].map(x=>[x,x+'×']),G.vspeed,v=>{G.vspeed=v;save();setSpeed();vin.value=v*100;vo.textContent=v.toFixed(2)+'×'}),
    h('div',{class:'dsec'},'Readability'),h('label',{class:'rng'},h('span',{},'Darken background'),dout,din),
    h('div',{class:'dsec'},'Animations'),segment([['full','Full'],['calm','Reduced']],G.motion,v=>{G.motion=v;save();applyMotion()}),
    h('p',{class:'hint'},'Reduced keeps the dashboard still apart from fades. Your device’s reduce-motion setting is always respected.'),
    h('button',{class:'pill',type:'button',style:'margin-top:18px;width:100%;justify-content:center',on:{click:()=>{Object.assign(G,{def:'',per:{},vspeed:1,dim:25,motion:'full'});save();applyMotion();setSpeed();applyStage();paintAp();toast('Appearance reset; your uploads are kept')}}},'Reset appearance'));
  db.scrollTop=y}
function openAppearance(){openDrawer('Appearance','Saved on this device',[]);apOpen=true;drawer.classList.add('ap');paintAp()}
const _close=closeDrawer;closeDrawer=function(){apOpen=false;drawer.classList.remove('ap');_close()};
$('#menu').onclick=openAppearance;$('#gear').onclick=openAppearance;
['dragenter','dragover'].forEach(ev=>drawer.addEventListener(ev,e=>{if(apOpen){e.preventDefault();drawer.classList.add('drop')}}));
['dragleave','drop'].forEach(ev=>drawer.addEventListener(ev,e=>{e.preventDefault();drawer.classList.remove('drop')}));
drawer.addEventListener('drop',e=>{if(apOpen&&e.dataTransfer.files.length)addFiles(e.dataTransfer.files)});

/* ripple on buttons and clickable cards */
document.addEventListener('pointerdown',e=>{if(calm())return;const t=e.target.closest('.pill,.circ,.ib,.chip,.tb,.card.click,.li,.chk,.gbar');if(!t)return;
  const r=t.getBoundingClientRect(),s=Math.max(r.width,r.height)*2.2,sp=h('span',{class:'rip',style:`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`});
  if(getComputedStyle(t).position==='static')t.style.position='relative';if(getComputedStyle(t).overflow!=='hidden')t.style.overflow='hidden';t.append(sp);setTimeout(()=>sp.remove(),650)});

/* ---------- start-up ---------- */
applyMotion();
const hs=(location.hash||'').slice(1);if(V[hs])T.scr=hs;
$('#ttl').textContent=TITLE[T.scr];
stageTitle();applyStage();render(0);
requestAnimationFrame(()=>{moveTab(true);moveChip(true);chipRow.dataset.ready=1});
addEventListener('resize',()=>{moveTab(true);moveChip(true)});
(async()=>{try{for(const c of G.customs){const b=await iget(c.id);if(b)URLS['c:'+c.id]=URL.createObjectURL(b)}G.customs=G.customs.filter(c=>URLS['c:'+c.id]);applyStage();paintAp()}catch(e){}})();
document.fonts&&document.fonts.ready.then(()=>{moveTab(true);moveChip(true)});

</script>
