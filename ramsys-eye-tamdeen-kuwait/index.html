<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1119">
<title>RAMsys Eye · Tamdeen Malls Kuwait</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: fixed top bar + tab strip, one centred 1180px work column; each tab is a stack of glass panels over a live node-network backdrop */
:root{
  --bg:#0b1119; --bg2:#101a26; --panel:rgba(22,32,45,.72); --panel-solid:#16202d; --line:rgba(160,185,210,.16); --line2:rgba(160,185,210,.28);
  --fg:#eef3f8; --muted:#93a3b5; --dim:#62738a;
  --olive:#8ea35a; --olive-hi:#b5c97a; --olive-deep:#3d4a26;
  --blue:#3a7bfd; --blue-hi:#8fb6ff; --cyan:#22c6b8; --violet:#a34be0;
  --ok:#2fcf6a; --warn:#f59e2b; --crit:#ef3e3e; --info:#4b8cff;
  --f-ui:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif; --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-ui);font-size:14px;min-height:100vh;overflow-x:hidden}
#net{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.app{position:relative;z-index:1}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--olive-hi);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#111}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(90deg,#0d0f12 0%,#1b1e22 55%,#3f4d2c 100%);border-bottom:1px solid #000}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar .wrap{display:flex;align-items:center;gap:14px;height:56px}
.logo{height:26px;width:auto;display:block}
.spacer{flex:1}
.blur-tg{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;color:var(--warn);letter-spacing:.06em;background:none;border:0;padding:4px}
.sw{width:50px;height:22px;border-radius:11px;background:#2a2f36;border:1px solid #444;position:relative;transition:.2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#ddd;transition:.2s}
.sw span{position:absolute;right:5px;top:3px;font-size:9px;color:#aaa}
.blur-on .sw{background:var(--olive-deep);border-color:var(--olive)}
.blur-on .sw::after{left:30px;background:var(--olive-hi)}
.blur-on .sw span{left:5px;right:auto;color:var(--olive-hi)}
.icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid #555;background:#15181c;display:grid;place-items:center;position:relative}
.icon-btn svg{width:16px;height:16px;stroke:#ddd;fill:none;stroke-width:1.8}
.badge{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--crit);font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;color:#fff}
.user{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.avatar{width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center}
.avatar svg{width:22px;height:22px}
.user b{display:block;font-size:13px}
.user small{font-size:10px;color:#bbb}
.caret{width:26px;height:26px;border-radius:6px;background:#232629;display:grid;place-items:center;border:0}
.caret svg{width:12px;stroke:#ccc;fill:none;stroke-width:2}

/* tab strip */
.tabs{border-bottom:1px solid var(--line);background:rgba(11,17,25,.6);backdrop-filter:blur(6px)}
.tabs .wrap{display:flex;align-items:center;gap:12px;min-height:60px;flex-wrap:wrap;padding-block:8px}
.navs{display:flex;gap:4px;overflow-x:auto;flex:1 1 560px;min-width:0;scrollbar-width:none}
.nav{display:flex;align-items:center;gap:8px;white-space:nowrap;background:none;border:0;border-bottom:2px solid transparent;padding:12px 10px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#dfe6ee}
.nav svg{width:18px;height:18px;stroke:#9aa7b4;fill:none;stroke-width:1.5}
.nav:hover{color:#fff}
.nav[aria-selected="true"]{border-bottom-color:var(--olive)}
.nav[aria-selected="true"] svg{stroke:var(--olive-hi)}
.ask{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:26px;padding:4px 4px 4px 12px;background:rgba(15,22,31,.8);flex:0 1 330px;min-width:240px}
.ask input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:13px}
.ask input::placeholder{color:#cfd7df}
.mic{width:16px;height:16px;stroke:#99a;fill:none;stroke-width:1.6}
.dot-logo{width:18px;height:18px;flex:none}
.btn-olive{background:linear-gradient(180deg,#9fb46a,#7d9150);border:0;border-radius:20px;padding:8px 20px;font-weight:600;font-size:13px;color:#fff}
.btn-olive:hover{filter:brightness(1.1)}

/* panels */
main.wrap{padding-block:24px 60px}
.view{display:grid;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line2);border-radius:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);min-width:0;overflow:hidden}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
.ph h2{margin:0;font-size:15px;font-weight:700;flex:1;min-width:160px}
.ph .hint{font-size:11px;color:var(--muted)}
.pill-btn{background:transparent;border:1px solid var(--line2);border-radius:8px;padding:8px 12px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.pill-btn:hover{border-color:var(--olive-hi)}
select.pill-btn{appearance:none;-webkit-appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,#9aa 50%),linear-gradient(135deg,#9aa 50%,transparent 50%);background-position:calc(100% - 13px) 52%,calc(100% - 9px) 52%;background-size:4px 4px;background-repeat:no-repeat;background-color:var(--panel-solid)}
select.pill-btn option{background:var(--panel-solid)}
.seg{display:inline-flex;gap:2px}
.seg button{background:none;border:0;border-bottom:2px solid transparent;padding:6px 10px;font-size:11px;font-weight:700;color:#cfd6de}
.seg button[aria-pressed="true"]{border-bottom-color:var(--olive);color:#fff}
.label{font-size:11px;color:var(--muted);letter-spacing:.03em}
.blurable{transition:filter .2s}
.blur-mode .blurable{filter:blur(7px)}

/* HOME */
.hello{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;justify-content:space-between}
.hello h1{margin:0;font-size:clamp(28px,4vw,40px);font-weight:500;letter-spacing:-.01em}
.hello .date{font-size:12px;font-weight:600;margin-top:4px;color:#cfd6de}
.home-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:16px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{position:relative;background:linear-gradient(140deg,rgba(40,48,58,.85),rgba(17,23,31,.85));border:1px solid var(--line2);border-radius:14px;padding:18px;min-height:200px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;transition:transform .2s,border-color .2s}
.tile:hover{transform:translateY(-3px);border-color:var(--olive)}
.tile b{font-size:15px;font-weight:700;letter-spacing:.02em;line-height:1.25;text-transform:uppercase}
.tile .tic{width:76px;height:76px;stroke:var(--olive-hi);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
.tile:hover .tic{transform:scale(1.06)}
.tile .go{position:absolute;right:12px;bottom:12px;width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e6e6e6,#8a8a8a);display:grid;place-items:center}
.tile .go svg{width:18px;stroke:#222;stroke-width:2.4;fill:none}
.tile .stat{font-size:11px;color:var(--muted)}
.tile .stat b{font-size:11px;color:var(--olive-hi);text-transform:none}

.map-panel{position:relative;padding:16px;min-height:520px;display:flex;flex-direction:column}
.map-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;position:relative;z-index:2}
.map-head h3{margin:0 0 8px;font-size:28px;font-weight:500}
.city-card{display:grid;grid-template-columns:auto auto;border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:rgba(10,14,20,.7)}
.city-card .tot{padding:12px 16px;min-width:130px}
.city-card .tot .big{font-size:28px;margin-top:6px}
.city-card .sub{display:grid;border-left:1px solid var(--line2);background:rgba(255,255,255,.04)}
.city-card .sub div{display:flex;align-items:center;gap:10px;padding:8px 14px;font-size:18px}
.city-card .sub div+div{border-top:1px solid var(--line2)}
.city-card svg{width:18px;height:18px;fill:none;stroke-width:2}
.loc-search{position:relative}
.loc-search input{background:#f4f6f8;color:#222;border:0;border-radius:8px;padding:11px 14px;width:200px;font-size:13px}
.loc-sug{position:absolute;top:100%;left:0;right:0;margin-top:4px;background:#f4f6f8;border-radius:8px;overflow:hidden;z-index:5}
.loc-sug button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 14px;color:#222;font-size:13px}
.loc-sug button:hover{background:#dde3ea}
.map-stage{flex:1;position:relative;margin-top:6px;min-height:500px;border-radius:10px;overflow:hidden;
  background-image:linear-gradient(rgba(150,180,210,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(150,180,210,.09) 1px,transparent 1px);background-size:28px 28px}
.map-stage svg{width:100%;height:100%;display:block;position:absolute;inset:0}
.prov{fill:url(#topg);stroke:rgba(220,235,255,.55);stroke-width:1;cursor:pointer;transition:fill .25s,opacity .25s}
.prov:hover{fill:#5f97ff}
.prov.live{fill:#3f78f5}
.prov.live:hover{fill:#6aa0ff}
.prov.dim{opacity:0}
.lift-name{fill:#3a1606;font:800 18px var(--f-ui);letter-spacing:.02em}
.sea{fill:rgba(160,190,220,.35);font:italic 600 14px var(--f-ui);letter-spacing:.2em}
.pin .lead{stroke:rgba(255,255,255,.45);stroke-width:1}
.pin .pl{fill:#e9f0f8;font:600 14px var(--f-ui);paint-order:stroke;stroke:rgba(8,15,30,.9);stroke-width:4px}
.pin .pn{fill:var(--olive-hi);font-weight:800}
.pin.sel .pl{fill:#fff;font-weight:800;font-size:15px}
.pin:focus{outline:none}
.pin:focus-visible .core{stroke-width:5;stroke:var(--olive-hi)}
.pin.sel .lead{stroke:var(--olive-hi);stroke-width:1.6}
.mall-row{width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer;padding:6px 0}
.mall-row:hover{color:var(--olive-hi)}
.pn2{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--olive-deep);color:var(--olive-hi);font-size:10px}
.pin{cursor:pointer}
.pin .halo{fill:var(--crit);opacity:.25;transform-box:fill-box;transform-origin:center;animation:pulse 2.2s infinite}
.pin .core{fill:#fff;stroke:var(--crit);stroke-width:3}

.pin.sel .core{fill:var(--olive-hi);stroke:#fff}
.pin.sel .halo{fill:var(--olive-hi);opacity:.4}
.pin:hover .core{stroke-width:5}
@keyframes pulse{0%{transform:scale(.6);opacity:.5}100%{transform:scale(2.2);opacity:0}}
.map-arrows{position:absolute;left:16px;top:160px;display:flex;z-index:2}
.map-arrows button{width:46px;height:46px;background:#111;border:1px solid #2b2b2b;display:grid;place-items:center}
.map-arrows svg{width:16px;stroke:#ddd;fill:none;stroke-width:2}
.map-sites{margin-top:12px;background:rgba(9,13,19,.85);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font-size:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));column-gap:20px}
.map-sites h4,.map-sites>button{grid-column:1/-1}
.map-sites h4{margin:0 0 6px;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.site-row{display:flex;justify-content:space-between;gap:8px;padding:4px 0}
.st{display:inline-flex;align-items:center;gap:6px;font-size:11px;white-space:nowrap}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.st.online{color:var(--ok)} .st.offline{color:var(--crit)} .st.maintenance{color:var(--warn)}

.glance{border-top:1px solid var(--line);padding-top:20px}
.glance-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.glance-head h2{margin:0;font-size:16px}
.glance-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.news{display:flex;gap:14px;min-width:0}
.thumb{flex:none;width:150px;height:120px;border-radius:6px;position:relative;overflow:hidden;display:grid;place-items:center}
.thumb svg{width:44px;height:44px;stroke:rgba(255,255,255,.85);fill:none;stroke-width:1.5}
.thumb .src{position:absolute;top:6px;right:6px;font-size:9px;font-weight:800;background:#fff;color:#a00;border-radius:10px;padding:2px 6px}
.news .when{font-size:12px;font-weight:700;color:var(--warn)}
.news h4{margin:4px 0;font-size:14px;line-height:1.3;text-wrap:balance}
.news p{margin:0;font-size:12px;color:var(--muted);line-height:1.4}
.pager{display:flex}
.pager button{width:38px;height:38px;border:1px solid #3a3f45;background:transparent;display:grid;place-items:center}
.pager svg{width:14px;stroke:#ccc;fill:none;stroke-width:2}

/* OPERATIONAL */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.two>*+*{border-left:1px solid var(--line)}
.sso{display:flex;align-items:center;justify-content:space-around;gap:20px;padding:30px 16px;flex-wrap:wrap}
.ring{width:210px;height:210px;flex:none}
.quad{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line2);border-radius:14px;overflow:hidden;background:rgba(0,0,0,.25)}
.quad>div{padding:16px 22px;text-align:center;min-width:92px}
.quad>div:nth-child(odd){border-right:1px solid var(--line2)}
.quad>div:nth-child(-n+2){border-bottom:1px solid var(--line2)}
.quad .label{font-size:12px;font-weight:600;color:#fff}
.quad .v{font-size:26px;margin-top:8px}
.tbl-wrap{overflow:auto;max-height:470px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:12px;font-weight:700;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel-solid)}
td{padding:11px 16px;border-bottom:1px solid rgba(160,185,210,.07)}
tr.click{cursor:pointer}
tr.click:hover td{background:rgba(142,163,90,.08)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px}
.chip i{width:22px;height:22px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;font-style:normal;font-size:11px}
.legend{display:flex;gap:16px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line);font-size:12px;font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend span::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.aho{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr)}
.aho-left{border-right:1px solid var(--line);display:flex;flex-direction:column}
.kv{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:14px 18px}
.kv .k{font-size:13px;line-height:1.3}
.kv .k b{display:block;font-weight:600}
.kv .v{font-size:22px;border-left:1px solid var(--line2);padding-left:14px;min-width:110px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:16px 18px;border-top:1px solid var(--line);margin-top:auto}
.trio .v{font-size:28px;margin-top:6px}
.chart{min-height:260px;padding:10px 8px 6px;position:relative}
.chart svg{display:block;width:100%}
.ax{fill:var(--muted);font:600 10px var(--f-num)}
.grid-l{stroke:rgba(160,185,210,.1)}
.vgrid{stroke:rgba(142,163,90,.35)}

/* ALARM */
.heat{min-width:760px}
.heat th,.heat td{text-align:center;padding:10px 6px;font-size:11px}
.heat th:first-child,.heat td:first-child{text-align:left;padding-left:12px;font-weight:700;font-size:12px}
.heat td.cell{color:#0b1830;font-weight:700;font-family:var(--f-num);border:1px solid rgba(0,0,0,.25);cursor:pointer}
.heat td.hot{color:#fff}
.trend-up{color:var(--crit);font-weight:700}
.trend-dn{color:var(--ok);font-weight:700}
.amo{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.8fr) minmax(0,1.2fr)}
.amo>*+*{border-left:1px solid var(--line)}
.donut-wrap{padding:14px;display:flex;flex-direction:column;align-items:center}
.types{max-height:440px;overflow:auto}
.type{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:14px 16px}
.type:hover{background:rgba(255,255,255,.04)}
.type[aria-pressed="true"]{background:linear-gradient(90deg,rgba(255,255,255,.16),rgba(255,255,255,.05));box-shadow:inset 3px 0 0 var(--c)}
.type b{display:block;font-size:12px;font-weight:600}
.type .v{font-size:24px;margin-top:4px}
.type .q{font-size:12px;font-weight:600;text-align:right}
.detail{padding:18px 20px;display:grid;gap:18px;align-content:start}
.detail h3{margin:0;font-size:16px}
.sev{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.sev div{padding:10px 12px}
.sev div+div{border-left:1px solid var(--line2)}
.sev b{font-size:12px;display:block}
.sev .v{font-size:20px;margin-top:4px}
.kv2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.kv2 .v{font-size:22px;margin:4px 0}
.kv2 small{color:var(--muted);font-size:11px}
.bar-mini{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:6px}
.bar-mini i{display:block;height:100%;background:var(--c,var(--olive))}

/* ACTIONABLE */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.hours{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);font-size:12px;font-weight:600}
.hours input[type=time]{background:transparent;border:1px solid var(--line2);border-radius:6px;padding:5px 8px;color:#fff}
.hours .lg{margin-left:auto;display:flex;gap:16px}
.hours .lg span{display:inline-flex;align-items:center;gap:6px}
.hours .lg span::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.reco{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:16px}
.reco article{border:1px solid var(--line2);border-radius:10px;padding:14px;background:rgba(0,0,0,.2);display:flex;flex-direction:column;gap:8px}
.reco h4{margin:0;font-size:14px}
.reco p{margin:0;font-size:12px;color:var(--muted);line-height:1.45;flex:1}
.reco .meta{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:10px;border:1px solid currentColor}
.reco .act{background:transparent;border:1px solid var(--olive);color:var(--olive-hi);border-radius:6px;padding:6px 10px;font-size:12px;font-weight:600}
.reco .act[disabled]{border-color:var(--ok);color:var(--ok);cursor:default}

/* COMMS */
.comms{display:grid;grid-template-columns:240px minmax(0,1fr) 280px;min-height:520px}
.comms>*+*{border-left:1px solid var(--line)}
.chan{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 14px}
.chan[aria-pressed="true"]{background:rgba(142,163,90,.14);box-shadow:inset 3px 0 0 var(--olive)}
.chan b{display:flex;justify-content:space-between;font-size:13px}
.chan small{color:var(--muted);font-size:11px}
.chan .unread{background:var(--olive);color:#111;border-radius:9px;font-size:10px;padding:1px 6px}
.thread{display:flex;flex-direction:column;min-width:0}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px;max-height:440px}
.msg{max-width:78%;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px;line-height:1.4}
.msg .who{font-size:11px;font-weight:700;color:var(--olive-hi);margin-bottom:3px;display:flex;gap:8px}
.msg .who time{color:var(--dim);font-weight:500}
.msg.me{align-self:flex-end;background:rgba(58,123,253,.18);border-color:rgba(58,123,253,.35)}
.msg.me .who{color:var(--blue-hi)}
.msg.sys{align-self:center;background:rgba(239,62,62,.12);border-color:rgba(239,62,62,.4);font-size:12px}
.compose{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.compose input{flex:1;min-width:0;background:rgba(0,0,0,.3);border:1px solid var(--line2);border-radius:20px;padding:9px 14px;outline:none}
.side h4{margin:0;padding:12px 14px;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--line)}
.unit{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:12px}
.unit b{display:block;font-size:13px}
.unit small{color:var(--muted)}
.call{background:none;border:1px solid var(--line2);border-radius:50%;width:30px;height:30px;display:grid;place-items:center;flex:none}
.call svg{width:14px;stroke:var(--olive-hi);fill:none;stroke-width:2}
.call.live{background:var(--ok);border-color:var(--ok)}
.call.live svg{stroke:#04220f}

/* overlays */
.pop{position:fixed;z-index:40;top:calc(60px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:min(360px,calc(100vw - 32px));background:var(--panel-solid);border:1px solid var(--line2);border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.5);overflow:hidden}
.pop h4{margin:0;padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px;display:flex;justify-content:space-between}
.pop h4 button{background:none;border:0;color:var(--olive-hi);font-size:11px}
.note{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);font-size:12px;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.note:hover{background:rgba(255,255,255,.04)}
.note i{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none;background:var(--c)}
.note small{display:block;color:var(--dim);margin-top:2px}
.note.read{opacity:.55}
.menu-item{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 14px;font-size:13px}
.menu-item:hover{background:rgba(255,255,255,.05)}
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(3,6,10,.7);display:grid;place-items:center;padding:20px}
.modal{width:min(620px,100%);max-height:80vh;overflow:auto;background:var(--panel-solid);border:1px solid var(--line2);border-radius:14px}
.modal .ph h2{font-size:14px}
.modal .body{padding:16px 18px;font-size:13px;line-height:1.55}
.modal .body table{margin-top:10px}
.x{background:none;border:0;font-size:20px;color:#aaa;line-height:1}
.ai-q{color:var(--muted);font-size:12px;margin-bottom:8px}
.typing::after{content:"▋";animation:blink 1s infinite;color:var(--olive-hi)}
@keyframes blink{50%{opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:#1f2a1a;border:1px solid var(--olive);color:#e8f0d8;padding:10px 18px;border-radius:24px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.kfs{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:flex-end}
.kfs div{display:flex;flex-direction:column}
.kfs b{font-size:22px;font-weight:600;color:var(--olive-hi)}
.kfs span{font-size:11px;color:var(--muted)}
.kfs small{font-size:10px;color:var(--dim);flex-basis:100%;text-align:right}
.codes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;padding:16px}
.code{text-align:left;background:rgba(0,0,0,.22);border:1px solid var(--line2);border-top:3px solid var(--c);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.code:hover{border-color:var(--c)}
.code b{font-size:13px;color:var(--c)}
.code span{font-size:12px;color:var(--muted)}
.code .v{font-size:26px;margin-top:6px}
.code small{font-size:11px;color:var(--dim)}
@media (max-width:980px){.codes{grid-template-columns:repeat(2,minmax(0,1fr))}.kfs small{text-align:left}}
.demo-tag{line-height:1.5;font-size:10px;color:var(--dim);text-align:center;padding:14px 0 0}

@media (max-width:980px){
  .home-grid,.two,.aho,.amo,.comms{grid-template-columns:1fr}
  .two>*+*,.amo>*+*,.comms>*+*{border-left:0;border-top:1px solid var(--line)}
  .aho-left{border-right:0;border-bottom:1px solid var(--line)}
  .glance-row,.reco{grid-template-columns:1fr}
  .map-panel{min-height:540px}
}
@media (max-width:560px){
  .user b,.user small{display:none}
  .blur-tg>span:first-child{display:none}
  .tiles{grid-template-columns:1fr 1fr}
  .tile{min-height:150px}
  .tile .tic{width:48px;height:48px}
  .thumb{width:96px;height:96px}
  .ask{flex:1 1 100%}
  .sev{grid-template-columns:1fr 1fr}
  .sev div:nth-child(3){border-left:0}
  .sev div:nth-child(n+3){border-top:1px solid var(--line2)}
  .map-stage{min-height:280px}
  .loc-search input{width:160px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const NOTES=[{t:'Code Adam · Al Kout Mall waterfront entrance',w:'17:41 · Ahmadi',c:'#ef3e3e',go:'alarm'},{t:'360 Kuwait car park LPR gates on Edge recording',w:'14:02 · Hawalli',c:'#f59e2b',go:'ops'},{t:'Food court footfall forecast above 85% on Friday',w:'15:10 · 360 Kuwait',c:'#a34be0',go:'act'},{t:'New message from 360 Kuwait security room',w:'14:41 · Hawalli',c:'#4b8cff',go:'comm'}];
function closeLayer(){$('#layer').innerHTML=''}
function pop(content){closeLayer();const p=h('div',{class:'pop'},...content);$('#layer').append(p);setTimeout(()=>document.addEventListener('click',function f(e){if(!p.contains(e.target)){closeLayer();document.removeEventListener('click',f)}}),0)}
$('#bellBtn').onclick=()=>{const unread=NOTES.filter(n=>!n.read).length;pop([h('h4',{},`Notifications (${unread})`,h('button',{on:{click:e=>{e.stopPropagation();NOTES.forEach(n=>n.read=1);updBell();closeLayer()}}},'Mark all read')),...NOTES.map(n=>h('button',{class:'note'+(n.read?' read':''),style:`--c:${n.c}`,on:{click:()=>{n.read=1;updBell();closeLayer();go(n.go)}}},h('i'),h('span',{},n.t,h('small',{},n.w))))])};
function updBell(){const u=NOTES.filter(n=>!n.read).length;$('#bellCount').textContent=u;$('#bellCount').hidden=!u}
const userMenu=()=>pop([h('h4',{},'Executive Mohammed'),...[['My profile','Profile: Executive · Central Security Operations · read access to all Kuwait malls'],['Report preferences','Daily executive brief scheduled for 07:00'],['Switch language (العربية)','Arabic interface available in production build'],['Sign out','Signed out (demo). Session kept for preview.']].map(([l,t])=>h('button',{class:'menu-item',on:{click:()=>{closeLayer();toast(t)}}},l))]);
$('#userBtn').onclick=userMenu;$('#caretBtn').onclick=userMenu;
$('#blurBtn').onclick=()=>{S.blur=!S.blur;$('#app').classList.toggle('blur-mode',S.blur);$('#blurBtn').classList.toggle('blur-on',S.blur);$('#blurBtn').setAttribute('aria-pressed',S.blur);$('#blurBtn .sw span').textContent=S.blur?'ON':'OFF'};
function modal(title,body){closeLayer();const bg=h('div',{class:'modal-bg',on:{click:e=>{if(e.target===bg)closeLayer()}}},h('div',{class:'modal',role:'dialog','aria-modal':'true','aria-label':title},h('div',{class:'ph'},h('h2',{},title),h('button',{class:'x','aria-label':'Close',on:{click:closeLayer}},'×')),h('div',{class:'body'},body)));$('#layer').append(bg)}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLayer()});

/* Ask RAMsys (simulated) */
$('#askForm').onsubmit=e=>{e.preventDefault();const q=$('#askIn').value.trim()||'Show recent alarms';const ql=q.toLowerCase();
  const city=CNAMES.find(c=>MALL[c].keys.some(k=>ql.includes(k)));const type=TYPES.find(t=>ql.includes(t.k.toLowerCase().split(' ')[0]));
  let sites=city?ALLSITES.filter(s=>s.city===city):ALLSITES;let ans,rows;
  if(ql.includes('offline')||ql.includes('down')){const off=sites.filter(s=>s.status!=='online');ans=`${off.length} security zone${off.length===1?'':'s'} ${city?'at '+HOSP[city]+' ':''}are not fully online right now.`;rows=off.map(s=>[s.name,HOSP[s.city],s.status])}
  else{const t=type?type.k:null;rows=sites.map(s=>[s.name,HOSP[s.city],t?s.alarms[t]:Object.values(s.alarms).reduce((a,b)=>a+b,0)]).sort((a,b)=>b[2]-a[2]).slice(0,6);const tot=rows.reduce((a,r)=>a+r[2],0);
    ans=`Found ${tot} ${t?t.toLowerCase()+' ':''}alarms ${city?'at '+HOSP[city]:'across all monitored malls'} this quarter. ${rows[0]?rows[0][0]+' has the most activity.':''}`}
  const p=h('p',{class:'typing',style:'margin:0 0 6px'});
  modal('Ask RAMsys',h('div',{},h('div',{class:'ai-q'},'You asked: “'+q+'”'),p,h('table',{},h('thead',{},h('tr',{},h('th',{},'Zone'),h('th',{},'Mall'),h('th',{},type||ql.includes('offline')?'Value':'Alarms'))),h('tbody',{},...rows.map(r=>h('tr',{},...r.map(x=>h('td',{},String(x))))))),
    h('div',{style:'display:flex;gap:8px;margin-top:14px;flex-wrap:wrap'},...['Offline zones at 360','Crowd alarms at Al Kout','Forced door alarms at Sama Jahra'].map(s=>h('button',{class:'pill-btn',on:{click:()=>{$('#askIn').value=s;$('#askForm').requestSubmit()}}},s)))));
  let i=0;const iv=setInterval(()=>{p.textContent=ans.slice(0,i+=3);if(i>=ans.length){clearInterval(iv);p.classList.remove('typing')}},18)};

/* ---------- network backdrop ---------- */
(function(){const c=$('#net'),x=c.getContext('2d');let W,H,P=[];const red=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){W=c.width=innerWidth;H=c.height=innerHeight;P=Array.from({length:Math.round(W*H/26000)},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.15,vy:(Math.random()-.5)*.15,r:Math.random()*2+1}))}
  function frame(){const g=x.createRadialGradient(W*.5,H*.4,0,W*.5,H*.4,Math.max(W,H)*.8);g.addColorStop(0,'#1b2b3c');g.addColorStop(1,'#0a0f16');x.fillStyle=g;x.fillRect(0,0,W,H);
    for(const p of P){if(!red){p.x+=p.vx;p.y+=p.vy}if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1}
    x.lineWidth=1;for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const a=P[i],b=P[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<170){x.strokeStyle=`rgba(120,170,210,${.16*(1-d/170)})`;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}
    for(const p of P){x.fillStyle='rgba(140,190,230,.35)';x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()}
    if(!red)requestAnimationFrame(frame)}
  addEventListener('resize',size);size();frame()})();

/* boot */
const hash=(location.hash||'').slice(1);if(TABS.some(t=>t[0]===hash))S.tab=hash;
buildNav();render();updBell();
</script>
