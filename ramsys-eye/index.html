<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e131a">
<title>RAMsys Eye Executive · Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap">
<style>
/* RAMsys Eye · executive tablet view. Layout: slim brand bar, one screen at a time (max 3 cards), bottom tab bar for thumbs. */
:root{
  color-scheme:dark;
  --page:#0b1119; --surface:#16202d; --surface2:#1c2836; --ink:#eef3f8; --ink2:#b4c0cc; --muted:#8a99aa;
  --grid:#25313f; --axis:#3a4757; --ring:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#d95926; --seq:#3987e5; --seq-track:#1d3352; --up-good:#0ca30c;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b; --none:#898781;
  --brand:#8ea35a; --brand-hi:#b5c97a; --chip:#1f2b39; --shadow:0 1px 2px rgba(0,0,0,.3);
  --f:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
}
:root[data-theme="light"]{
  color-scheme:light;
  --page:#f4f3ef; --surface:#fcfcfb; --surface2:#f3f2ee; --ink:#0b0b0b; --ink2:#52514e; --muted:#77756f;
  --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10);
  --s1:#2a78d6; --s2:#eb6834; --seq:#2a78d6; --seq-track:#dbe8fa; --up-good:#006300;
  --chip:#ebeae4; --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:light){:root:not([data-theme]){
  color-scheme:light;
  --page:#f4f3ef; --surface:#fcfcfb; --surface2:#f3f2ee; --ink:#0b0b0b; --ink2:#52514e; --muted:#77756f;
  --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10);
  --s1:#2a78d6; --s2:#eb6834; --seq:#2a78d6; --seq-track:#dbe8fa; --up-good:#006300;
  --chip:#ebeae4; --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05);
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink)}
body{font-family:var(--f);font-size:16px;line-height:1.4;min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brand-hi);outline-offset:2px}
.tab{font-variant-numeric:tabular-nums}

/* brand bar: always dark so both logos read */
.bar{position:sticky;top:0;z-index:20;background:linear-gradient(90deg,#0d0f12 0%,#1b1e22 55%,#3f4d2c 100%);padding:env(safe-area-inset-top,0px) 0 0}
.bar .in{display:flex;align-items:center;gap:14px;height:60px;padding:0 max(20px,env(safe-area-inset-right,0px)) 0 max(20px,env(safe-area-inset-left,0px))}
.bar .logo{height:24px;display:block}
.bar .gd{height:32px;background:#fff;border-radius:6px;padding:3px 8px;display:block}
.bar .sep{width:1px;height:26px;background:rgba(255,255,255,.2)}
.bar .sp{flex:1}
.live{display:flex;align-items:center;gap:8px;font-size:13px;color:#cfd8e1;white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 rgba(12,163,12,.6);animation:beat 2s infinite}
@keyframes beat{70%{box-shadow:0 0 0 8px rgba(12,163,12,0)}100%{box-shadow:0 0 0 0 rgba(12,163,12,0)}}
.ibtn{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);display:grid;place-items:center;color:#e8eef4}
.ibtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* screens */
main{max-width:1240px;margin:0 auto;padding:24px max(20px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.screen{animation:enter .45s cubic-bezier(.2,.7,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.head h1{margin:0;font-size:30px;font-weight:600;letter-spacing:-.01em}
.head p{margin:4px 0 0;color:var(--ink2);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media (max-width:1023px){.c3{grid-column:span 6}.c4,.c5,.c6,.c7,.c8{grid-column:span 12}}
@media (max-width:540px){.c3{grid-column:span 12}.head h1{font-size:25px}.bar .gd{height:26px}.live span{display:none}}

/* cards */
.card{background:var(--surface);border:1px solid var(--ring);border-radius:18px;box-shadow:var(--shadow);padding:20px 22px;min-width:0;position:relative}
.ch{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.ch h2{margin:0;font-size:17px;font-weight:600}
.ch p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.tbtn{border:1px solid var(--ring);background:transparent;border-radius:10px;min-height:36px;padding:0 12px;font-size:13px;color:var(--ink2);flex:none}
.tbtn[aria-pressed="true"]{background:var(--chip);color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:8px 6px;border-bottom:1px solid var(--grid)}
td{padding:9px 6px;border-bottom:1px solid var(--grid)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}

/* stat tiles */
.stat .lbl{font-size:14px;color:var(--ink2)}
.stat .val{font-size:38px;font-weight:600;line-height:1.1;margin-top:6px;letter-spacing:-.01em}
.stat .val small{font-size:18px;font-weight:500;color:var(--ink2);margin-left:2px}
.stat .row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:8px;min-height:34px}
.delta{font-size:13px;color:var(--ink2);display:inline-flex;align-items:center;gap:4px}
.delta b{font-weight:600}
.delta.good b{color:var(--up-good)}
.delta.bad b{color:var(--crit)}
.spark{width:110px;height:34px;flex:none}
.meter{height:8px;border-radius:4px;background:var(--seq-track);overflow:hidden;margin-top:14px}
.meter i{display:block;height:100%;border-radius:4px;background:var(--seq);width:0;transition:width 1.1s cubic-bezier(.2,.7,.2,1)}
.sicon{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:12px;font-weight:700;color:#fff;flex:none}

/* line chart */
.lc{position:relative;height:280px;touch-action:pan-y}
.lc svg{display:block;width:100%;height:100%;overflow:visible}
.gl{stroke:var(--grid);stroke-width:1}
.base{stroke:var(--axis);stroke-width:1}
.axt{fill:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.endl{fill:var(--ink2);font-size:12px;font-weight:600}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:14px;height:3px;border-radius:2px;background:var(--c)}
.legend i.dot{width:10px;height:10px;border-radius:50%}
.legend i.dash{background:none;border-top:2px dashed var(--muted);height:0}

/* horizontal bars (HTML so they reflow with the tablet) */
.hb{display:grid;gap:4px}
.hrow{display:grid;grid-template-columns:minmax(96px,34%) minmax(0,1fr) 64px;align-items:center;gap:12px;min-height:44px;border:0;background:none;text-align:left;padding:0 6px;border-radius:10px;width:100%}
.hrow:hover,.hrow.on{background:var(--surface2)}
.hrow .nm{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .nm small{display:block;font-size:12px;color:var(--muted)}
.hrow .tr{height:22px;position:relative}
.hrow .fill{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--c,var(--seq));width:0;transition:width .9s cubic-bezier(.2,.7,.2,1)}
.hrow .v{font-size:15px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.flag{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink2);margin-left:6px}
.flag i{width:8px;height:8px;border-radius:50%;background:var(--c)}

/* columns */
.cols{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:end;height:220px;padding-top:24px;border-bottom:1px solid var(--axis)}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;border:0;background:none;padding:0}
.col .bx{width:min(48px,60%);border-radius:4px 4px 0 0;background:var(--c);height:0;transition:height .9s cubic-bezier(.2,.7,.2,1);position:relative}
.col .bv{font-size:16px;font-weight:600;margin-bottom:6px;font-variant-numeric:tabular-nums}
.collab{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:8px;font-size:13px;color:var(--ink2);text-align:center}
.collab span{display:inline-flex;align-items:center;justify-content:center;gap:6px}

/* ring + segmented bar */
.ringwrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.ring{width:150px;height:150px;flex:none}
.ring circle{fill:none;stroke-width:12}
.ring .arc{stroke:var(--seq);stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.7,.2,1)}
.ring text{fill:var(--ink);font-size:30px;font-weight:600}
.ring .rs{fill:var(--muted);font-size:12px;font-weight:500}
.kv{display:grid;gap:10px;font-size:14px;color:var(--ink2)}
.kv b{font-size:20px;color:var(--ink);font-weight:600;margin-right:6px;font-variant-numeric:tabular-nums}
.kv span{display:inline-flex;align-items:center;gap:8px}
.kv i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.seg{display:flex;gap:2px;height:14px;margin-top:20px}
.seg i{display:block;height:100%;background:var(--c);flex:0 0 0;transition:flex-grow .9s cubic-bezier(.2,.7,.2,1);min-width:0}
.seg i:first-child{border-radius:4px 0 0 4px}.seg i:last-child{border-radius:0 4px 4px 0}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.chip{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--ring);background:var(--surface);white-space:nowrap;font-size:14px;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* alarm list */
.alist{display:grid;gap:2px}
.arow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;min-height:60px;padding:8px 6px;border:0;border-bottom:1px solid var(--grid);background:none;text-align:left;width:100%}
.arow:last-child{border-bottom:0}
.arow:hover{background:var(--surface2)}
.arow b{font-size:15px;font-weight:600;display:block}
.arow small{font-size:13px;color:var(--muted)}
.arow .t{font-size:13px;color:var(--ink2);text-align:right;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px 3px 8px;border-radius:12px;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--c)}

/* bottom tab bar */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--page) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--ring)}
.nav .in{display:flex;gap:6px;background:var(--surface);border:1px solid var(--ring);border-radius:22px;padding:6px;box-shadow:var(--shadow)}
.nb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:96px;min-height:56px;border:0;border-radius:16px;background:none;font-size:12px;font-weight:600;color:var(--muted)}
.nb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nb[aria-selected="true"]{background:var(--chip);color:var(--ink)}
.nb[aria-selected="true"] svg{stroke:var(--brand-hi)}
:root[data-theme="light"] .nb[aria-selected="true"] svg{stroke:#5f7232}
@media (prefers-color-scheme:light){:root:not([data-theme]) .nb[aria-selected="true"] svg{stroke:#5f7232}}
@media (max-width:540px){.nb{min-width:72px}}

/* tooltip + bottom sheet */
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--ring);border-radius:12px;padding:10px 12px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.25);min-width:140px;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s}
.tip.show{opacity:1;transform:none}
.tip b{display:block;font-size:13px;margin-bottom:4px}
.tip div{display:flex;align-items:center;gap:8px;justify-content:space-between}
.tip div span{display:inline-flex;align-items:center;gap:6px;color:var(--ink2)}
.tip i{width:10px;height:3px;border-radius:2px;background:var(--c)}
.shade{position:fixed;inset:0;z-index:60;background:rgba(3,6,10,.5);opacity:0;transition:opacity .25s}
.shade.show{opacity:1}
.sheet{position:fixed;left:50%;bottom:0;z-index:61;width:min(760px,100%);max-height:82vh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 24px calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,100%);transition:transform .35s cubic-bezier(.2,.7,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.3)}
.sheet.show{transform:translate(-50%,0)}
.grab{width:44px;height:5px;border-radius:3px;background:var(--axis);margin:4px auto 14px}
.sheet h3{margin:0;font-size:22px;font-weight:600}
.sheet .sub{color:var(--ink2);font-size:14px;margin:4px 0 18px}
.sheet h4{margin:22px 0 8px;font-size:14px;color:var(--muted);font-weight:600}
.close{position:absolute;right:16px;top:14px}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:26px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:22px;font-size:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.stat .row{flex-wrap:wrap}
.delta{white-space:nowrap}
.spark{width:84px}

/* ==========================================================================
   Collapsible sidebar component
   Three layouts, chosen by viewport width (set on <body> by sidebar.js):
     data-mode="wide"   ≥1024px  sidebar pushes content; collapses to a 76px icon rail
     data-mode="mid"    768-1023 icon rail; expanding slides it over the content
     data-mode="narrow" <768px   off-canvas drawer opened from a menu button
   data-sb="full|rail" says how wide it currently is; data-open marks an overlay/drawer.
   ========================================================================== */
:root{
  --sb-w:268px; --sb-rail:76px; --sb-ez:cubic-bezier(.22,.8,.24,1); --sb-t:.38s;
  --sb-bg:#0e131a; --sb-bg2:#131b25; --sb-ink:#eef3f8; --sb-ink2:#aab6c3; --sb-muted:#6f7d8c;
  --sb-line:rgba(255,255,255,.07); --sb-hover:rgba(255,255,255,.05);
  --sb-accent:#b5c97a; --sb-active:rgba(181,201,122,.13); --sb-badge:#d03b3b;
  --sb-font:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
}
.sb{position:fixed;top:0;bottom:0;left:0;z-index:40;width:var(--sb-w);display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--sb-bg2),var(--sb-bg));color:var(--sb-ink2);border-right:1px solid var(--sb-line);
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
  overflow:hidden;font-family:var(--sb-font);
  transition:width var(--sb-t) var(--sb-ez),transform var(--sb-t) var(--sb-ez),box-shadow var(--sb-t)}
[data-sb="rail"] .sb{width:var(--sb-rail)}
[data-mode="mid"][data-open] .sb{box-shadow:24px 0 60px rgba(0,0,0,.35)}
[data-mode="narrow"] .sb{width:min(300px,86vw);transform:translateX(-102%)}
[data-mode="narrow"][data-open] .sb{transform:none;box-shadow:24px 0 60px rgba(0,0,0,.45)}

/* the page content shifts with the sidebar only in wide mode */
.sb-content{margin-left:var(--sb-w);transition:margin-left var(--sb-t) var(--sb-ez);min-width:0}
[data-mode="wide"][data-sb="rail"] .sb-content,[data-mode="mid"] .sb-content{margin-left:var(--sb-rail)}
[data-mode="narrow"] .sb-content{margin-left:0}
.sb-scrim{position:fixed;inset:0;z-index:39;background:rgba(4,8,12,.45);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .3s}
[data-open] .sb-scrim{opacity:1;pointer-events:auto}
.sb-noanim .sb,.sb-noanim .sb *,.sb-noanim .sb-content{transition:none!important}

/* header: brand + collapse control */
.sb-head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:72px;padding:0 14px 0 22px;flex:none;transition:padding var(--sb-t) var(--sb-ez)}
.sb-brand{display:block;overflow:hidden;width:150px;flex:none;transition:width var(--sb-t) var(--sb-ez)}
.sb-brand img{height:26px;width:auto;display:block;max-width:none}
[data-sb="rail"] .sb-head{flex-direction:column;justify-content:center;padding:16px 0 6px;gap:12px}
[data-sb="rail"] .sb-brand{width:27px}
.sb-toggle{width:40px;height:40px;border-radius:12px;border:1px solid var(--sb-line);background:transparent;color:var(--sb-ink2);display:grid;place-items:center;flex:none;cursor:pointer;transition:background .2s,color .2s}
.sb-toggle:hover{background:var(--sb-hover);color:var(--sb-ink)}
.sb-toggle svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sb-toggle .chev{transition:transform var(--sb-t) var(--sb-ez);transform-box:fill-box;transform-origin:center}
[data-sb="rail"] .sb-toggle .chev{transform:scaleX(-1)}

/* nav list with a sliding active indicator */
.sb-nav{position:relative;flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 12px 12px;scrollbar-width:none}
.sb-nav::-webkit-scrollbar{display:none}
.sb-ind{position:absolute;left:12px;right:12px;top:0;height:48px;border-radius:12px;background:var(--sb-active);box-shadow:inset 0 0 0 1px rgba(181,201,122,.2);opacity:0;pointer-events:none;
  transition:transform var(--sb-t) var(--sb-ez),height var(--sb-t) var(--sb-ez),opacity .2s}
.sb-ind::before{content:"";position:absolute;left:-12px;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--sb-accent)}
.sb-gt{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--sb-muted);padding:18px 14px 8px;white-space:nowrap;transition:opacity .2s}
[data-sb="rail"] .sb-gt{opacity:0}
.sb-item{position:relative;z-index:1;display:flex;align-items:center;gap:14px;width:100%;min-height:48px;padding:0 13px;margin:1px 0;border:0;border-radius:12px;background:none;
  color:var(--sb-ink2);font:500 15px var(--sb-font);text-align:left;white-space:nowrap;cursor:pointer;transition:color .2s,background .2s}
.sb-item:hover{background:var(--sb-hover);color:var(--sb-ink)}
.sb-item:focus-visible{outline:2px solid var(--sb-accent);outline-offset:-2px}
.sb-item.on{color:var(--sb-ink)}
.sb-ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s,transform .2s}
.sb-item.on .sb-ic{stroke:var(--sb-accent)}
.sb-item:active .sb-ic{transform:scale(.9)}
.sb-lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;transition:opacity .22s .12s,transform var(--sb-t) var(--sb-ez)}
[data-sb="rail"] .sb-lb{opacity:0;transform:translateX(-8px);transition-delay:0s}
.sb-badge{min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--sb-badge);color:#fff;font:700 11px var(--sb-font);display:inline-grid;place-items:center;font-variant-numeric:tabular-nums;flex:none;transition:transform .3s var(--sb-ez)}
.sb-badge.soft{background:rgba(255,255,255,.07);color:var(--sb-ink2)}
.sb-badge[hidden]{display:none}

/* ---- build devices and alarms (seeded, so the same on every load) ---- */
const DEV=[],ALM=[];const NOW=Date.now();

  L.sys=SYS.filter(s=>!(L.hub&&s.k==='GATE')).map(s=>s.k);
  L.sys.forEach(k=>{const R=rng(L.id+k);
    SYSM[k].dev.forEach(([px,model,n,zt])=>{const named=L.hub&&HUBN[px];const cnt=named?named.length:Math.max(1,Math.round(n*L.scale));
      for(let i=0;i<cnt;i++){const zl=L.zt[zt];const [id,zone]=named?named[i].split('|'):[`${L.id}-${px}-${p2(i+1)}`,zl[i%zl.length]];
        DEV.push({id,loc:L.id,sys:k,px,model,zone,base:Math.round(91+R()*9),fw:`${1+Math.floor(R()*5)}.${Math.floor(R()*10)}.${Math.floor(R()*30)}`,temp:Math.round(27+R()*17),up:(97.6+R()*2.39).toFixed(2),hb:Math.round(2+R()*55)})}})});
});
const DEVBY=Object.fromEntries(DEV.map(d=>[d.id,d]));
LOCS.forEach(L=>L.sys.forEach(k=>{const R=rng('al'+L.id+k),ri=(a,b)=>a+Math.floor(R()*(b-a+1)),pk=a=>a[Math.floor(R()*a.length)];
  const tp=AT[k],idx=tp.map((_,i)=>i);for(let i=idx.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}
  const forced=L.hub&&HUBF[k];if(forced){const f=tp.findIndex(t=>t[0]===forced);idx.splice(idx.indexOf(f),1);idx.unshift(f)}
  const n=Math.min(tp.length,2+Math.floor(R()*3));
  for(let j=0;j<n;j++){const t=tp[idx[j]];const own=DEV.filter(d=>d.loc===L.id&&d.sys===k);const pool=own.filter(d=>d.px===t[3]);const d=pk(pool.length?pool:own);
    const u=R(),st=forced?'Active':j===0?(u<.42?'Active':u<.58?'Ack':'Resolved'):(u<.08?'Active':u<.18?'Ack':'Resolved');
    const ago=st==='Active'?ri(2,420):st==='Ack'?ri(20,900):ri(60,1400);
    ALM.push({id:'ALM-'+(52000+ALM.length*7+ri(0,6)),loc:L.id,sys:k,dev:d.id,t:t[0],sev:t[1],m:t[2]({L,d,z:d.zone,ri,pk,R}),st,ts:NOW-ago*60000})}
}));

/* ---- derived state ---- */
const isOpen=a=>a.st!=='Resolved';

/* ---------- derived figures ---------- */

const BUCKETS=[...Array(24)].map((_,i)=>NOW-(24-i)*HR);
const rr=rng('resolve');const RESOLVED_AT=new Map(ALM.filter(a=>a.st==='Resolved').map(a=>[a.id,Math.min(NOW-6e4,a.ts+(10+rr()*80)*6e4)]));

  const resolved=BUCKETS.map(s=>al.filter(a=>{const t=RESOLVED_AT.get(a.id);return t&&t>=s&&t<s+HR}).length);
  return{labels:BUCKETS.map(hourLabel),raised,resolved}}
const ackR=rng('ack');const ACK7=[...Array(7)].map((_,i)=>Math.round(38+ackR()*18-i*.8));
const DAYS=[...Array(7)].map((_,i)=>new Date(NOW-(6-i)*864e5).toLocaleDateString('en-US',{weekday:'short'}));
function sysAgg(k,loc){const locs=loc==='all'?LOCS.filter(l=>l.sys.includes(k)):[LOC[loc]];

const tip=h('div',{class:'tip',role:'status','aria-live':'polite'});document.body.append(tip);

function mkTable({head,rows,num=[]}){return h('div',{style:'overflow:auto;max-height:340px'},h('table',{},h('thead',{},h('tr',{},...head.map((x,i)=>h('th',{class:num.includes(i)?'n':''},x)))),

/* ---------- charts ---------- */
function sparkline(data){const W=110,H=34,mx=Math.max(1,...data),X=i=>2+i*(W-8)/(data.length-1),Y=v=>H-3-v/mx*(H-8);

function lineChart({labels,series,yMax,step,target,unit='',name}){
  const box=h('div',{class:'lc'});
  const leg=(series.length>1||target)?h('div',{class:'legend'},...series.map(s=>h('span',{style:`--c:${s.c}`},h('i'),s.name)),target?h('span',{},h('i',{class:'dash'}),target.label):''):'';
  let animated=false;
  const draw=()=>{const W=box.clientWidth,H=box.clientHeight;if(!W)return;box.innerHTML='';
    const n=labels.length,pad={l:36,r:58,t:14,b:30},X=i=>pad.l+i*(W-pad.l-pad.r)/(n-1),Y=v=>H-pad.b-v/yMax*(H-pad.t-pad.b);
    const svg=sv('svg',{viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':name});box.append(svg);
    for(let v=0;v<=yMax;v+=step){svg.append(sv('line',{x1:pad.l,x2:W-pad.r,y1:Y(v),y2:Y(v),class:v?'gl':'base'}));const t=sv('text',{x:pad.l-10,y:Y(v)+4,'text-anchor':'end',class:'axt'});t.textContent=v;svg.append(t)}
    const every=Math.ceil(n/(W<520?4:6));labels.forEach((l,i)=>{if(i%every&&i!==n-1)return;const t=sv('text',{x:X(i),y:H-8,'text-anchor':i===n-1?'end':'middle',class:'axt'});t.textContent=l;svg.append(t)});
    if(target)svg.append(sv('line',{x1:pad.l,x2:W-pad.r,y1:Y(target.v),y2:Y(target.v),style:'stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4'}));
    const ends=series.map(s=>Y(s.data[n-1])),close=ends.length>1&&Math.abs(ends[0]-ends[1])<16;
    series.forEach((s,k)=>{const pts=s.data.map((v,i)=>[X(i),Y(v)]),d='M'+pts.map(p=>p.join(',')).join('L');
      if(s.area){const a=sv('path',{d:d+`L${X(n-1)},${Y(0)}L${X(0)},${Y(0)}Z`,style:`fill:${s.c};opacity:${animated||reduce?.1:0};transition:opacity 1s .4s`});svg.append(a);if(!animated)requestAnimationFrame(()=>a.style.opacity=.1)}

      if(!animated&&!reduce){const L=p.getTotalLength();p.style.strokeDasharray=L;p.style.strokeDashoffset=L;p.getBoundingClientRect();p.style.transition=`stroke-dashoffset 1.4s cubic-bezier(.2,.7,.2,1) ${k*.15}s`;p.style.strokeDashoffset=0}
      const [ex,ey]=pts[n-1];svg.append(sv('circle',{cx:ex,cy:ey,r:4.5,style:`fill:${s.c};stroke:var(--surface);stroke-width:2`}));
      if(!close||k===0){const t=sv('text',{x:ex+10,y:ey+4,class:'endl'});t.textContent=s.data[n-1]+unit;svg.append(t)}});

    const hit=sv('rect',{x:pad.l,y:0,width:W-pad.l-pad.r,height:H,fill:'transparent'});svg.append(hit);
    const move=e=>{const r=svg.getBoundingClientRect(),i=Math.max(0,Math.min(n-1,Math.round((e.clientX-r.left-pad.l)/((W-pad.l-pad.r)/(n-1)))));

function hBars(rows,{max,fmt=v=>v,onTap}={}){const m=max||Math.max(1,...rows.map(r=>r.v)),el=h('div',{class:'hb'});

SCR.systems=()=>{const rows=SYS.filter(Y=>T.sysLoc==='all'||LOC[T.sysLoc].sys.includes(Y.k)).map(Y=>{const A=sysAgg(Y.k,T.sysLoc);return{k:Y.k,label:Y.n,v:A.hp,open:A.open.length,n:A.devs.length}}).sort((a,b)=>a.v-b.v);
  rows.forEach(r=>{r.sub=`${r.n} devices · ${r.open} open`;r.tip=`<b>${r.label}</b>${r.v}% health · ${r.open} open alarms`;if(r.v<85){r.c='var(--warn)';r.sub=h('span',{},`${r.n} devices · ${r.open} open`,h('span',{class:'flag',style:'--c:var(--warn)'},h('i'),'Needs attention'))}});
  const chips=h('div',{class:'chips',role:'group','aria-label':'Location'},...[['all','All locations'],...LOCS.map(l=>[l.id,l.short])].map(([v,l])=>h('button',{class:'chip','aria-pressed':T.sysLoc===v,on:{click:()=>{T.sysLoc=v;render()}}},l)));
  const g=h('div',{class:'grid'},card('c12','System health','Average device health per system, lowest first. Tap a system for details.',
    hBars(rows,{max:100,fmt:v=>v+'%',onTap:r=>openSheet(r.k,T.sysLoc)}),
    ()=>({head:['System','Health','Devices','Open alarms'],num:[1,2,3],rows:rows.map(r=>[r.label,r.v+'%',r.n,r.open])})));
  return[head('Systems',T.sysLoc==='all'?'All locations':LOC[T.sysLoc].name),h('div',{style:'margin-bottom:16px'},chips),g]};

SCR.alarms=()=>{const open=ALM.filter(isOpen),sc=sevCount(open);
  const urgent=open.filter(a=>SEVR[a.sev]>=3).sort((a,b)=>(SEVR[b.sev]-SEVR[a.sev])||(b.ts-a.ts));
  const g=h('div',{class:'grid'},
    card('c5','Open alarms by severity','All locations',columns(SEVS.map(k=>({k,v:sc[k],c:TSEV[k],tip:`<b>${k}</b>${sc[k]} open alarms`}))),
      ()=>({head:['Severity','Open'],num:[1],rows:SEVS.map(k=>[k,sc[k]])})),
    card('c7','Acknowledgement time','Average seconds to acknowledge, last 7 days',
      lineChart({labels:DAYS,series:[{name:'Avg acknowledgement',c:'var(--s1)',data:ACK7,area:1}],yMax:80,step:20,unit:' s',target:{v:60,label:'Target 60 s'},name:'Average acknowledgement time per day'}),
      ()=>({head:['Day','Seconds'],num:[1],rows:DAYS.map((d,i)=>[d,ACK7[i]])})),
    card('c12','Needs attention now',`${urgent.length} critical and high alarms open. Tap one to see its system.`,
      h('div',{class:'alist'},...urgent.slice(0,8).map(a=>h('button',{class:'arow',on:{click:()=>openSheet(a.sys,a.loc)}},pill(a.sev,TSEV[a.sev]),
        h('div',{},h('b',{},`${a.t} · ${LOC[a.loc].short}`),h('small',{},`${SYSM[a.sys].n} · ${a.m}`)),h('span',{class:'t'},tm(a.ts).split(' · ')[1]))))));
  return[head('Alarms','Open alarms and response across all locations'),g]};

function head(t,s){return h('div',{class:'head'},h('div',{},h('h1',{},t),h('p',{},s)))}

/* ---------- navigation ---------- */
const NAV=[['overview','Overview','<rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/>'],
  ['locations','Locations','<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>'],
  ['systems','Systems','<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/>'],
  ['alarms','Alarms','<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>']];
function buildNav(){const n=$('#nav .in');n.innerHTML='';NAV.forEach(([id,l,ic])=>n.append(h('button',{class:'nb',role:'tab','aria-selected':T.scr===id,on:{click:()=>go(id)},html:`<svg viewBox="0 0 24 24">${ic}</svg>${l}`})))}
function go(id){T.scr=id;try{history.replaceState(null,'','#'+id)}catch(e){}closeSheet();buildNav();render();window.scrollTo({top:0,behavior:reduce?'auto':'smooth'})}
function render(){hideTip();const m=$('#main');m.innerHTML='';const s=h('div',{class:'screen'},...SCR[T.scr]());m.append(s,h('p',{class:'note'},'Sample data for demonstration, shared with the RAMsys Eye and RAMsys Sentrl dashboards. Change the background in Appearance.'))}

/* ---------- header ---------- */
function setTheme(t){if(t)document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('eye-exec-theme',t)}catch(e){}}
try{const t=localStorage.getItem('eye-exec-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}
const curTheme=()=>document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
function toggleTheme(){const cur=curTheme();setTheme(cur==='light'?'dark':'light');toast(cur==='light'?'Dark theme':'Light theme')}
const clock=()=>{$('#clock').textContent=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})};clock();setInterval(clock,30000);

</script>
<script>
/* ==========================================================================
   createSidebar(options) – collapsible sidebar component, no dependencies.
   Markup it needs: an empty <aside> for the sidebar, your page wrapped in an
   element with class "sb-content", and optionally a menu <button> for phones.
   Returns { select, refresh, toggle, open, close }.
   ========================================================================== */
function createSidebar(o){
  const root=o.root||document.body,el=o.el,KEY=o.storageKey||'sidebar',WIDE=o.wideAt||1024,MID=o.midAt||768;
  const mk=(t,c,html)=>{const e=document.createElement(t);if(c)e.className=c;if(html!=null)e.innerHTML=html;return e};
  let collapsed=false;try{collapsed=localStorage.getItem(KEY)==='rail'}catch(e){}
  let open=false,active={id:null,child:null};const expanded=new Set(o.expanded||[]),btns={},subs={};

  /* skeleton */
  el.id=el.id||'sidebar';el.tabIndex=-1;el.classList.add('sb');el.setAttribute('aria-label',o.label||'Main navigation');
  const head=mk('div','sb-head'),brand=mk('a','sb-brand',o.brand||'');brand.href='#';
  brand.addEventListener('click',e=>{e.preventDefault();o.onBrand&&o.onBrand()});
  const tg=mk('button','sb-toggle','<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/><path class="chev" d="m16 10-2 2 2 2"/></svg>');
  tg.type='button';tg.setAttribute('aria-controls',el.id);head.append(brand,tg);
  const nav=mk('nav','sb-nav'),ind=mk('span','sb-ind');nav.setAttribute('aria-label',o.label||'Main');ind.setAttribute('aria-hidden','true');nav.append(ind);
  const foot=mk('div','sb-foot');if(o.footer)o.footer(foot,{item:footItem});
  el.append(head,nav,foot);
  const scrim=mk('div','sb-scrim'),tip=mk('div','sb-tip');tip.setAttribute('role','tooltip');document.body.append(scrim,tip);

  /* items */
  function makeItem(it,parent){const child=!!parent,b=mk('button','sb-item'+(child?' sb-child':''));b.type='button';b.dataset.label=it.label;
    b.innerHTML=(child?`<span class="sb-dot"></span>`:`<svg class="sb-ic" viewBox="0 0 24 24" aria-hidden="true">${it.icon||''}</svg>`)+`<span class="sb-lb"></span><span class="sb-badge" hidden></span>`;
    b.querySelector('.sb-lb').textContent=it.label;
    if(it.children)b.append(mk('span','sb-chev','<svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>'));
    b.addEventListener('click',()=>{
      if(it.children&&!isRail()){if(active.id===it.id&&!active.child){expanded.has(it.id)?expanded.delete(it.id):expanded.add(it.id);syncGroups();return}expanded.add(it.id);syncGroups()}
      select(child?parent.id:it.id,child?it.id:null,true)});
    tipFor(b);return b}
  function footItem(label,icon,onClick){const b=mk('button','sb-item',`<svg class="sb-ic" viewBox="0 0 24 24" aria-hidden="true">${icon}</svg><span class="sb-lb"></span>`);
    b.type='button';b.dataset.label=label;b.querySelector('.sb-lb').textContent=label;b.addEventListener('click',onClick);tipFor(b);return b}
  function build(){nav.querySelectorAll('.sb-group').forEach(g=>g.remove());
    o.groups.forEach(g=>{const sec=mk('div','sb-group');if(g.title){const t=mk('div','sb-gt');t.textContent=g.title;sec.append(t)}
      g.items.forEach(it=>{const b=makeItem(it);btns[it.id]=b;sec.append(b);
        if(it.children){const sub=mk('div','sb-sub'),inner=mk('div','sb-sub-in');sub.id=el.id+'-sub-'+it.id;b.setAttribute('aria-controls',sub.id);
          it.children.forEach(c=>{const cb=makeItem(c,it);btns[it.id+'/'+c.id]=cb;inner.append(cb)});sub.append(inner);subs[it.id]=sub;sec.append(sub)}});
      nav.append(sec)});
    syncGroups();refresh()}
  const val=v=>typeof v==='function'?v():v;
  function refresh(){o.groups.forEach(g=>g.items.forEach(it=>{paint(btns[it.id],it);(it.children||[]).forEach(c=>paint(btns[it.id+'/'+c.id],c))}));place()}
  function paint(b,it){const v=val(it.badge),bd=b.querySelector('.sb-badge');bd.textContent=v??'';bd.hidden=v==null||v===''||v===0;bd.className='sb-badge'+(it.tone?' '+it.tone:'');
    const d=b.querySelector('.sb-dot');if(d)d.style.setProperty('--c',val(it.dot)||'currentColor');
    b.dataset.label=it.label+(v&&it.badgeLabel?` · ${v} ${it.badgeLabel}`:'')}

  /* selection and the sliding indicator */
  function select(id,child,user){active={id,child:child||null};
    Object.entries(btns).forEach(([k,b])=>{const cur=child?k===id+'/'+child:k===id;b.classList.toggle('on',cur||k===id);cur?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current')});
    glide();if(user){o.onSelect&&o.onSelect(id,active.child);if(mode()!=='wide')setOpen(false)}}
  function place(){const kid=active.child&&expanded.has(active.id)&&!isRail()&&btns[active.id+'/'+active.child],t=kid||btns[active.id];
    if(!t){ind.style.opacity=0;return}const r=t.getBoundingClientRect(),n=nav.getBoundingClientRect();
    ind.style.opacity=1;ind.style.transform=`translateY(${(r.top-n.top+nav.scrollTop).toFixed(1)}px)`;ind.style.height=r.height+'px'}
  function glide(){const t0=performance.now(),f=()=>{place();if(performance.now()-t0<460)requestAnimationFrame(f)};f()}
  function syncGroups(){Object.entries(subs).forEach(([id,s])=>{const on=expanded.has(id);s.classList.toggle('open',on);btns[id].setAttribute('aria-expanded',on&&!isRail());s.inert=!on||isRail()});glide()}

  /* layout modes */
  const mode=()=>innerWidth>=WIDE?'wide':innerWidth>=MID?'mid':'narrow';
  const isRail=()=>root.dataset.sb==='rail';
  function apply(){const m=mode();if(m==='wide')open=false;root.dataset.mode=m;
    root.dataset.sb=m==='wide'?(collapsed?'rail':'full'):m==='mid'?(open?'full':'rail'):'full';
    open&&m!=='wide'?root.dataset.open='':delete root.dataset.open;
    el.inert=m==='narrow'&&!open;
    tg.setAttribute('aria-expanded',String(!isRail()));
    tg.setAttribute('aria-label',m==='narrow'?'Close menu':isRail()?'Expand sidebar':'Collapse sidebar');
    if(o.menuButton){o.menuButton.setAttribute('aria-expanded',String(open));o.menuButton.setAttribute('aria-controls',el.id)}
    hideTip();syncGroups()}
  function toggle(){if(mode()==='wide'){collapsed=!collapsed;try{localStorage.setItem(KEY,collapsed?'rail':'full')}catch(e){}apply()}else setOpen(!open)}
  function setOpen(v){if(mode()==='wide')return;open=v;apply();
    if(v){setTimeout(()=>el.focus({preventScroll:true}),60)}else if(mode()==='narrow'&&o.menuButton)o.menuButton.focus({preventScroll:true})}

  /* tooltips beside the rail */
  function tipFor(b){const show=()=>{if(!isRail())return;const r=b.getBoundingClientRect();tip.textContent=b.dataset.label;tip.style.left=(r.right+12)+'px';tip.style.top=(r.top+r.height/2)+'px';tip.classList.add('show')};
    b.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')show()});b.addEventListener('focus',show);b.addEventListener('pointerleave',hideTip);b.addEventListener('blur',hideTip)}
  function hideTip(){tip.classList.remove('show')}

  /* events: toggle, scrim, keyboard, swipe, resize */
  tg.addEventListener('click',toggle);scrim.addEventListener('click',()=>setOpen(false));
  if(o.menuButton)o.menuButton.addEventListener('click',()=>setOpen(true));
  nav.addEventListener('scroll',()=>{hideTip();place()},{passive:true});
  document.addEventListener('keydown',e=>{const typing=/input|textarea|select/i.test(e.target.tagName)||e.target.isContentEditable;
    if(e.key==='Escape'&&open){setOpen(false);return}
    if(((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='b')||(!typing&&!e.ctrlKey&&!e.metaKey&&e.key==='[')){e.preventDefault();toggle()}});
  let sx=null,sy=0,edge=false;
  document.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;edge=mode()==='narrow'&&!open&&sx<20},{passive:true});
  document.addEventListener('touchmove',e=>{if(sx==null)return;const t=e.touches[0],dx=t.clientX-sx;if(Math.abs(t.clientY-sy)>Math.abs(dx))return;
    if(edge&&dx>60){setOpen(true);sx=null}else if(open&&dx<-60){setOpen(false);sx=null}},{passive:true});
  document.addEventListener('touchend',()=>{sx=null},{passive:true});
  let rz=0,lastMode=null;addEventListener('resize',()=>{cancelAnimationFrame(rz);rz=requestAnimationFrame(()=>{const m=mode();if(m!==lastMode){open=false;lastMode=m}apply()})});

  /* start without animating the first layout */
  root.classList.add('sb-noanim');build();lastMode=mode();apply();if(o.active)select(o.active,o.activeChild);
  requestAnimationFrame(()=>requestAnimationFrame(()=>root.classList.remove('sb-noanim')));
  return{select:(id,child)=>select(id,child,false),refresh,toggle,open:()=>setOpen(true),close:()=>setOpen(false)}
}

</script>

['dragenter','dragover'].forEach(ev=>setEl.addEventListener(ev,e=>{e.preventDefault();setEl.classList.add('drag')}));
['dragleave','drop'].forEach(ev=>setEl.addEventListener(ev,e=>{e.preventDefault();setEl.classList.remove('drag')}));
setEl.addEventListener('drop',e=>useFiles(e.dataTransfer.files));

/* start-up: load saved uploads, and bring over a single upload from the earlier version */
applyGlass();applyColors();applyBg();
(async()=>{try{
  const old=await idbGet('bg');
  if(old&&G.customs.length<MAXC){const item={id:'legacy',kind:/^video\//.test(old.type)?'video':'image'};await idbSet('bg:legacy',old);await idbDel('bg');
    G.customs.push(item);const prev=JSON.parse(localStorage.getItem(GKEY)||'{}');if(prev.bg==='custom'){G.def=G.bg='c:legacy'}gSave()}
  for(const c of G.customs){const b=await idbGet('bg:'+c.id);if(b)URLS['c:'+c.id]=URL.createObjectURL(b)}
  G.customs=G.customs.filter(c=>URLS['c:'+c.id]);applyBg();paintSet()}catch(e){}})();
</script>
<script>
/* ==========================================================================
   HERO LAYOUT — full-bleed photo/video, circular icon nav, ask bar, cards along the bottom.
   Shares the data, Appearance settings and uploaded backgrounds with the glass layout.
   ========================================================================== */
const ICO={
  bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  pulse:'<path d="M3 12h4l2-6 4 12 2-6h6"/>',
  timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  report:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'
};
const svgI=p=>`<svg viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
const isHero=()=>document.documentElement.dataset.layout==='hero';
const greet=()=>{const hr=new Date().getHours();return hr<12?'Good morning':hr<18?'Good afternoon':'Good evening'};

/* ---------- header, nav and ask bar ---------- */
const heroEl=h('div',{id:'hero'});
const brandSrc=($('.sb-brand img')||{}).src||'',gdSrc=($('.tlogo img')||{}).src||'',avSrc=($('.tav')||{}).src||'';
const hnav=h('nav',{class:'hnav','aria-label':'Dashboard'});
function buildHnav(){hnav.innerHTML='';
  NAV.forEach(([id,l,ic])=>{const b=h('button',{class:'hnb',type:'button','aria-label':l,title:l,'aria-current':T.scr===id?'page':null,html:svgI(ic)});
    if(T.scr!==id)b.removeAttribute('aria-current');
    if(id==='alarms'){const n=ALM.filter(a=>isOpen(a)&&a.sev==='Critical').length;if(n)b.append(h('i',{class:'hbadge'},n))}
    b.onclick=()=>go(id);hnav.append(b)});
  const ap=h('button',{class:'hnb',type:'button','aria-label':'Appearance',title:'Appearance',html:svgI(ICO.gear)});ap.onclick=()=>openSettings();hnav.append(ap)}
const ask=h('input',{id:'ask',type:'search',autocomplete:'off',spellcheck:'false','aria-label':'Search locations, systems, devices and alarms',placeholder:'Just ask me anything'});
const askList=h('div',{class:'asklist',role:'listbox'});
const hhi=h('p',{class:'hhi'});
heroEl.append(
  h('a',{class:'hbrand',href:'#',on:{click:e=>{e.preventDefault();go('overview')}}},h('span',{class:'hlogo'},h('img',{src:brandSrc,alt:''})),h('span',{},h('b',{},'RAMsys Eye'),h('small',{},'Executive'))),
  hnav,
  h('div',{class:'hask'},gdSrc?h('img',{class:'hgd',src:gdSrc,alt:'ITV Intertech Vision'}):'',hhi,h('div',{class:'askw'},ask,askList)),
  h('div',{class:'hright'},
    h('button',{class:'hcirc',type:'button',title:'Add photo or video','aria-label':'Add background photo or video',html:svgI(ICO.plus),on:{click:()=>fileIn.click()}}),
    h('div',{class:'huser'},h('img',{src:avSrc,alt:'Demo User'}),h('span',{},h('b',{},'Demo User'),h('small',{},'Executive')))));
document.body.insertBefore(heroEl,$('.sb-content'));

/* search across locations, systems, alarms and devices */
let askHits=[],askSel=0;
function searchAll(q){q=q.trim().toLowerCase();if(!q)return[];const out=[],has=s=>s.toLowerCase().includes(q);
  NAV.forEach(([id,l])=>{if(has(l))out.push({t:'Screen',l,s:'Open the '+l.toLowerCase()+' screen',go:()=>go(id)})});
  LOCS.forEach(L=>{if(has(L.name+' '+L.short+' '+L.id+' '+L.air))out.push({t:'Location',l:L.name,s:locStat(L.id).open+' open alarms',go:()=>{T.loc=L.id;go('locations')}})});
  SYS.forEach(Y=>{if(has(Y.n+' '+Y.k))out.push({t:'System',l:Y.n,s:sysAgg(Y.k,'all').hp+'% health · all locations',go:()=>openSheet(Y.k,'all')})});
  ALM.filter(isOpen).forEach(a=>{if(has(a.t+' '+a.id+' '+a.sev))out.push({t:a.sev+' alarm',l:a.t+' · '+LOC[a.loc].short,s:a.m,go:()=>openSheet(a.sys,a.loc)})});
  DEV.forEach(d=>{if(has(d.id+' '+d.model))out.push({t:'Device',l:d.id,s:d.model+' · '+LOC[d.loc].short,go:()=>openSheet(d.sys,d.loc)})});
  return out.slice(0,8)}
function paintAsk(){askList.innerHTML='';askList.classList.toggle('show',!!ask.value.trim());
  if(!ask.value.trim())return;
  if(!askHits.length){askList.append(h('div',{class:'askno'},'Nothing found. Try a location, system, device ID or alarm.'));return}
  askHits.forEach((r,i)=>{const b=h('button',{class:'askit'+(i===askSel?' on':''),type:'button',role:'option'},h('small',{},r.t),h('b',{},r.l),h('span',{},r.s));
    b.onmousedown=e=>{e.preventDefault();pickAsk(i)};askList.append(b)})}
function pickAsk(i){const r=askHits[i];if(!r)return;ask.value='';askHits=[];paintAsk();ask.blur();r.go()}
ask.addEventListener('input',()=>{askHits=searchAll(ask.value);askSel=0;paintAsk()});
ask.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){askSel=Math.min(askHits.length-1,askSel+1);paintAsk();e.preventDefault()}
  else if(e.key==='ArrowUp'){askSel=Math.max(0,askSel-1);paintAsk();e.preventDefault()}
  else if(e.key==='Enter'){pickAsk(askSel)}else if(e.key==='Escape'){ask.value='';askHits=[];paintAsk()}});
ask.addEventListener('blur',()=>setTimeout(()=>askList.classList.remove('show'),120));
ask.addEventListener('focus',()=>{if(ask.value.trim())askList.classList.add('show')});
/* typed placeholder hints */
(()=>{const tips=['Just ask me anything','Try "Terminal 3"','Try "door forced"','Try "video wall"','Try "Z1-CON-04"'];let ti=0,ci=0,del=false;
  if(reduce){return}
  setInterval(()=>{if(document.activeElement===ask||ask.value)return;const t=tips[ti];
    if(!del){ci++;if(ci>t.length+14){del=true}}else{ci-=2;if(ci<=0){ci=0;del=false;ti=(ti+1)%tips.length}}
    ask.placeholder=t.slice(0,Math.min(ci,t.length))||' '},70)})();

/* ---------- small visual helpers ---------- */
function waves(cls=''){const W=400,mk=(k,amp,ph,c,o)=>{let d='';for(let x=0;x<=W*2;x+=4){const env=.55+.45*Math.sin(2*Math.PI*x/W+ph);const y=30+amp*env*Math.sin(2*Math.PI*k*x/W+ph*2);d+=(x?'L':'M')+x+','+y.toFixed(1)}
    return `<path d="${d}" style="stroke:${c};opacity:${o}"/>`};
  return h('div',{class:'wv '+cls,'aria-hidden':'true',html:`<svg viewBox="0 0 ${W} 60" preserveAspectRatio="none">${mk(2,18,0,'var(--accent)',1)}${mk(3,14,1.7,'#f5c76b',.75)}${mk(1,20,3.1,'rgba(255,255,255,.85)',.55)}</svg>`})}
function hcard(cls,icon,title,meta,...body){return h('section',{class:'hc '+cls},
  h('div',{class:'hch'},icon?h('span',{class:'hci',html:svgI(icon)}):'',h('h2',{},title),meta?h('span',{class:'hmeta'},meta):''),...body)}
const fmtDate=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});

/* ---------- hero overview ---------- */
let gaugeSys=null;
function heroOverview(){
  const open=ALM.filter(isOpen),start=NOW-24*HR,act=activity(),ds=DEV.map(devState);
  const healthy=ds.filter(x=>x.st==='Healthy').length,pct=Math.round(healthy/DEV.length*100),hpAvg=Math.round(ds.reduce((a,x)=>a+x.hp,0)/ds.length);
  const raised24=act.raised.reduce((a,b)=>a+b,0),res24=act.resolved.reduce((a,b)=>a+b,0),resRate=Math.round(res24/Math.max(1,raised24)*100);
  const crit=open.filter(a=>a.sev==='Critical').length;

  /* toolbar */
  const tools=h('div',{class:'htools'},
    h('button',{class:'hcirc sm',type:'button',title:'Search','aria-label':'Search',html:svgI(ICO.search),on:{click:()=>{window.scrollTo({top:0,behavior:reduce?'auto':'smooth'});ask.focus()}}}),
    h('button',{class:'hcirc sm',type:'button',title:'Appearance','aria-label':'Appearance',html:svgI(ICO.edit),on:{click:()=>openSettings()}}),
    h('span',{class:'hpill',html:svgI(ICO.cal)+`<span>${fmtDate(new Date(NOW-864e5))} – ${fmtDate(new Date(NOW))}</span>`}),
    h('span',{class:'hpill live2'},h('i'),h('span',{},'Live · '),h('b',{class:'tab'},new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}))),
    h('button',{class:'hpill',type:'button',html:svgI(ICO.plus)+'<span>Add background</span>',on:{click:()=>fileIn.click()}}),
    h('button',{class:'hpill',type:'button',html:svgI(ICO.report)+'<span>Create a report</span>',on:{click:()=>window.print()}}));

  /* A · alarm timeline strips */
  const strips=h('div',{class:'strips'});
  ['Critical','High','Medium'].forEach(sev=>{const row=h('div',{class:'srow'},h('span',{class:'slbl'},sev));const tr=h('div',{class:'strk'});
    ALM.filter(a=>a.sev===sev&&a.ts>=start).forEach((a,i)=>{const b=h('i',{style:`left:${((a.ts-start)/(24*HR)*100).toFixed(2)}%;width:${(isOpen(a)?3.6:2.2)}%;opacity:${isOpen(a)?1:.45}`,title:`${a.t} · ${LOC[a.loc].short}`});
      b.style.animationDelay=(i*25)+'ms';tr.append(b)});row.append(tr);strips.append(row)});
  strips.append(h('div',{class:'srow ax'},h('span'),h('div',{class:'saxis'},...[0,6,12,18,23].map(i=>h('span',{style:`left:${i/23*100}%`},act.labels[i].slice(0,2))))));
  const A=hcard('ha','bell'in ICO?ICO.bell:'','Alarms','Last 24 hours',strips,
    h('div',{class:'hfoot'},h('div',{class:'big'},h('b',{class:'tab'},open.length),h('small',{},'Open alarms')),h('span',{class:'hsub'},h('span',{class:'hsi',html:svgI(ICO.bell)}),`${crit} critical open`)));
  A.style.cursor='pointer';A.onclick=()=>go('alarms');

  /* B · cumulative raised vs resolved */
  const cum=a=>a.reduce((o,v,i)=>(o.push((o[i-1]||0)+v),o),[]),cr=cum(act.raised),cs=cum(act.resolved),mx=Math.max(1,cr[23]);
  const W=240,H=110,X=i=>28+i*(W-34)/23,Y=v=>H-16-v/mx*(H-28);
  const curve=arr=>arr.map((v,i)=>i?`C${(X(i-1)+X(i))/2},${Y(arr[i-1])} ${(X(i-1)+X(i))/2},${Y(v)} ${X(i)},${Y(v)}`:`M${X(0)},${Y(v)}`).join('');
  let g='';[0,.5,1].forEach(f=>{const v=Math.round(mx*f);g+=`<line x1="28" x2="${W-6}" y1="${Y(v)}" y2="${Y(v)}" class="hgl"/><text x="20" y="${Y(v)+4}" text-anchor="end" class="hax">${v}</text>`});
  [0,8,16,23].forEach(i=>{g+=`<text x="${X(i)}" y="${H-2}" text-anchor="middle" class="hax">${act.labels[i].slice(0,2)}</text>`});
  const B=hcard('hb',ICO.pulse,'Activity','Last 24 hours',
    h('div',{class:'hline',html:`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Alarms raised and resolved, cumulative">${g}<path d="${curve(cr)}" class="hl1"/><path d="${curve(cs)}" class="hl2"/></svg>`}),
    h('div',{class:'hfoot'},h('div',{class:'big'},h('b',{class:'tab'},raised24),h('small',{},'raised')),
      h('span',{class:'hsub'},h('i',{class:'k1'}),'Raised ',h('i',{class:'k2'}),`Resolved ${res24}`)));

  /* C · acknowledgement per day */
  const bars=h('div',{class:'hbars'});
  ACK7.forEach((v,i)=>{const last=i===6,b=h('div',{class:'hbar'+(last?' on':''),title:`${DAYS[i]}: ${v} s`},h('span',{class:'trk'},h('i',{style:`--h:${Math.round(v/80*100)}%`})),h('small',{},DAYS[i].slice(0,1)));bars.append(b)});
  const C=hcard('hcc',ICO.timer,'Response','Last 7 days',bars,
    h('div',{class:'hfoot'},h('div',{class:'big'},h('b',{class:'tab'},ACK7[6]),h('small',{},'s')),h('span',{class:'hsub'},'Avg acknowledgement · ▼ 6 s')));

  /* D · system gauge */
  const sysList=SYS.map(Y=>({Y,A:sysAgg(Y.k,'all')})).sort((a,b)=>a.A.hp-b.A.hp).slice(0,6);
  if(!gaugeSys||!sysList.some(x=>x.Y.k===gaugeSys))gaugeSys=sysList[0].Y.k;
  const D=h('section',{class:'hc hd'});
  function paintGauge(){D.innerHTML='';const cur=sysList.find(x=>x.Y.k===gaugeSys),v=cur.A.hp;
    const icons=h('div',{class:'gic'},...sysList.map(({Y})=>{const b=h('button',{class:'gb'+(Y.k===gaugeSys?' on':''),type:'button',title:Y.n,'aria-label':Y.n,'aria-pressed':Y.k===gaugeSys},Y.ic);
      b.onclick=()=>{gaugeSys=Y.k;paintGauge()};return b}));
    const N=46,cx=130,cy=128,r1=96;let t='';
    for(let i=0;i<N;i++){const f=i/(N-1),a=Math.PI*(1-f),long=i%5===0,r2=r1-(long?20:13),on=f<=v/100;
      t+=`<line x1="${(cx+r1*Math.cos(a)).toFixed(1)}" y1="${(cy-r1*Math.sin(a)).toFixed(1)}" x2="${(cx+r2*Math.cos(a)).toFixed(1)}" y2="${(cy-r2*Math.sin(a)).toFixed(1)}" class="${on?'gt on':'gt'}" style="transition-delay:${i*14}ms"/>`}
    const am=Math.PI*(1-v/100),mxp=cx+(r1+10)*Math.cos(am),myp=cy-(r1+10)*Math.sin(am);
    t+=`<circle cx="${mxp.toFixed(1)}" cy="${myp.toFixed(1)}" r="5" class="gm"/>`;
    const gsvg=h('div',{class:'gauge',html:`<svg viewBox="0 0 260 140" role="img" aria-label="${cur.Y.n} health ${v}%">${t}</svg>`},
      h('div',{class:'gval'},h('small',{},'Health'),h('b',{class:'tab'},v+'%')));
    D.append(icons,gsvg,waves('gwv'),
      h('button',{class:'gcap',type:'button',on:{click:()=>openSheet(cur.Y.k,'all')}},h('b',{},cur.Y.n),h('span',{},`${cur.A.devs.length} devices · ${cur.A.open.length} open alarms · all locations`)));
    requestAnimationFrame(()=>D.querySelectorAll('.gt').forEach(x=>x.classList.add('in')))}
  paintGauge();

  /* E · estate health score */
  const cond=hpAvg>=90?'Excellent condition':hpAvg>=80?'Good condition':hpAvg>=65?'Needs attention':'Poor condition';
  const E=h('section',{class:'hc he'},h('div',{class:'hch'},h('h2',{},'Estate health')),
    h('div',{class:'score'},h('b',{class:'tab'},hpAvg),h('strong',{},cond),h('span',{},`${fmt(healthy)} of ${fmt(DEV.length)} devices healthy`)),
    waves(),
    h('div',{class:'hstats'},h('div',{},h('small',{},'Locations'),h('b',{},LOCS.length)),
      h('button',{class:'hins',type:'button',on:{click:()=>go('locations')}},h('span',{html:svgI(ICO.chart)}),'Insights'),
      h('div',{class:'r'},h('small',{},'Healthy devices'),h('b',{},pct+'%'))));

  /* F · alarm response, 20-minute buckets */
  const bk=[...Array(72)].map((_,i)=>ALM.filter(a=>a.ts>=start+i*HR/3&&a.ts<start+(i+1)*HR/3).length),bm=Math.max(1,...bk),peak=bk.indexOf(bm);
  const code=h('div',{class:'code',role:'img','aria-label':'Alarms raised per 20 minutes, last 24 hours'},...bk.map((v,i)=>h('i',{class:i===peak?'pk':'',style:`--h:${Math.max(14,v/bm*100)}%`})));
  const F=h('section',{class:'hc hf'},h('div',{class:'hch'},h('h2',{},'Alarm response')),
    h('div',{class:'score'},h('b',{class:'tab'},resRate),h('strong',{},'Resolution rate'),h('span',{},`${res24} of ${raised24} resolved · peak at ${new Date(start+peak*HR/3).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}`)),
    code,
    h('div',{class:'hstats'},h('div',{},h('small',{},'Open critical'),h('b',{},crit)),
      h('button',{class:'hins',type:'button',on:{click:()=>go('alarms')}},h('span',{html:svgI(ICO.chart)}),'Insights'),
      h('div',{class:'r'},h('small',{},'Avg acknowledgement'),h('b',{},ACK7[6]+' s'))));

  return[tools,h('div',{class:'hgrid'},A,B,C,D,E,F)]}

/* ---------- wire the layout into the app ---------- */
const glassOverview=SCR.overview;
SCR.overview=()=>isHero()?heroOverview():glassOverview();
const prevRender=render;
render=function(){document.body.dataset.scr=T.scr;prevRender();hhi.textContent=`${greet()}. Need anything?`;buildHnav()};
function applyLayout(){document.documentElement.dataset.layout=G.layout==='glass'?'glass':'hero';render()}
applyLayout();
</script>
